function genBank(L,id){
  const Q=[];const add=(q)=>{q.id=q.grp+'|'+q.type+'|'+q.level;Q.push(q)};
  const pick=(arr,n,not)=>shuffle(arr.filter(x=>!not.includes(x))).slice(0,n);
  const terms=L.terms||[];
  terms.forEach(([t,d,o],i)=>{
    const ot=pick(terms.map(x=>x[0]),3,[t]);if(ot.length>=2)add({grp:'t'+i,obj:o,level:1,type:'mcq',text:`أيّ مصطلح يعني: ${d}`,options:[t,...ot],explain:`${t}: ${d}`});
    const od=pick(terms.map(x=>x[1]),3,[d]);if(od.length>=2)add({grp:'t'+i,obj:o,level:2,type:'mcq',text:`ما المقصود بـ«${t}»؟`,options:[d,...od],explain:`${t}: ${d}`});
  });
  (L.groups||[]).forEach((g,gi)=>{
    g.cats.forEach(([c,its,co])=>{const others=g.cats.filter(x=>x[0]!==c),ob=co||g.obj;
      its.forEach(it=>{const truth=Math.random()<.5||!others.length;const cat=truth?c:sample(others)[0];
        add({grp:'g'+gi+it,obj:ob,level:1,type:'tf',text:`«${it}» من مجموعة «${cat}».`,answer:cat===c,explain:`«${it}» من مجموعة «${c}».`})});
      const oth=others.flatMap(x=>x[1]);
      shuffle(its).slice(0,2).forEach((it,k)=>{const ds=pick(oth,3,[]);if(ds.length>=2)add({grp:'gc'+gi+c+k,obj:ob,level:2,type:'mcq',text:`أيّ مما يلي من مجموعة «${c}»؟`,options:[it,...ds],explain:`«${it}» من مجموعة «${c}».`})});
    })});
  (L.seqs||[]).forEach((s,si)=>{const n=s.steps.length;
    for(let i=0;i<(s.cyclic?n:n-1);i++){const a=s.steps[i],b=s.steps[(i+1)%n];const ds=pick(s.steps,3,[a,b]);
      if(ds.length>=2)add({grp:'s'+si+'-'+i,obj:s.obj,level:2,type:'mcq',text:(s.ask||'في {t}، ما الذي يأتي بعد «{a}»؟').replace('{t}',s.title).replace('{a}',a),options:[b,...ds],explain:`الترتيب: ${s.steps.join(' ← ')}`})}
    const win=Math.min(n,5);[0,1].forEach(k=>{if(k&&n<=5)return;const st=s.cyclic?Math.floor(Math.random()*n):Math.floor(Math.random()*(n-win+1));const items=Array.from({length:win},(_,j)=>s.steps[(st+j)%n]);
      add({grp:'so'+si+k,obj:s.obj,level:3,type:'order',text:s.orderText||`رتّب ما يأتي بالترتيب الصحيح (${s.title}).`,items,explain:`الترتيب الصحيح: ${items.join(' ← ')}`})});
  });
  (L.pairs||[]).forEach((p,pi)=>{const A=p.list.map(x=>x[0]),B=p.list.map(x=>x[1]);
    p.list.forEach(([a,b],i)=>{const db=pick(B,3,[b]),da=pick(A,3,[a]);
      if(db.length>=2)add({grp:'p'+pi+'-'+i,obj:p.obj,level:1,type:'mcq',text:p.ask.replace('{a}',a),options:[b,...db],explain:`${a}: ${b}`});
      if(p.rev&&da.length>=2)add({grp:'p'+pi+'-'+i,obj:p.obj,level:2,type:'mcq',text:p.rev.replace('{b}',b),options:[a,...da],explain:`${a}: ${b}`})});
    [0,1].forEach(k=>{if(k&&p.list.length<6)return;add({grp:'pm'+pi+k,obj:p.obj,level:2,type:'match',text:p.title,pairs:shuffle(p.list).slice(0,4),explain:p.list.map(x=>`${x[0]}: ${x[1]}`).join('، ')})});
  });
  if(L.parts){const P=L.parts;P.items.forEach(([k,name,fn,ofn])=>{
    add({grp:'pt'+k,obj:P.obj,level:1,type:'hot',text:`المس «${name}» في الرسم.`,answer:k,explain:`هذا هو «${name}».`});
    if(fn){const fs=pick(P.items.filter(x=>x[2]).map(x=>x[2]),3,[fn]);if(fs.length>=2)add({grp:'pf'+k,obj:ofn||P.obj,level:2,type:'mcq',text:`ما وظيفة «${name}»؟`,options:[fn,...fs],explain:`«${name}»: ${fn}`})}})}
  // أكمل الفراغ: من أفكار الدرس التي تحتوي على أحد مصطلحاته
  const tn=terms.map(t=>t[0]).sort((a,b)=>b.length-a.length);
  (L.facts||[]).forEach(([o,f],i)=>{const t=tn.find(x=>f.includes(x));if(!t)return;let ds=tn.filter(x=>x!==t&&!f.includes(x));
    if(ds.length<3){const gr=+id[1];ds=ds.concat(shuffle(Object.keys(LES).filter(k=>+k[1]===gr&&k!==id).flatMap(k=>(LES[k].terms||[]).map(x=>x[0]))).filter(x=>x!==t&&!f.includes(x)))}
    ds=[...new Set(ds)].slice(0,3);if(ds.length>=2)add({grp:'fb'+i,obj:o,level:2,type:'mcq',text:'أكمل الفراغ: '+f.replace(t,'……'),options:[t,...shuffle(ds)],explain:f})});
  (L.seqs||[]).forEach((s,si)=>{const n=s.steps.length;for(let i=1;i<n;i++){const a=s.steps[i],b=s.steps[i-1];const ds=pick(s.steps,3,[a,b]);if(ds.length>=2)add({grp:'sb'+si+'-'+i,obj:s.obj,level:2,type:'mcq',text:`في ${s.title}، ما الذي يأتي مباشرة قبل «${a}»؟`,options:[b,...ds],explain:`الترتيب: ${s.steps.join(' ← ')}`})}});
  (L.qs||[]).forEach((q,i)=>add({grp:'h'+i,...q}));
  return Q;
}
function buildQuiz(L,id,n=Settings.get('qcount')){
  const bank=genBank(L,id);const seenArr=store.get('seen_'+id,[]),seen=new Set(seenArr);
  const objs=shuffle([...new Set(bank.map(q=>q.obj))]);
  const lv=shuffle(Array.from({length:n},(_,i)=>i<Math.round(n*.375)?1:i<Math.round(n*.75)?2:3));const slots=objs.map(o=>({obj:o,level:lv.pop()||2}));
  while(slots.length<n){slots.push({obj:sample(objs),level:lv.pop()||sample([1,2,3])})}
  const usedG=new Set(),out=[];
  for(const s of slots){const order=[1,2,3].sort((a,b)=>Math.abs(a-s.level)-Math.abs(b-s.level));let q=null;
    for(const l of order){const c=bank.filter(x=>x.obj===s.obj&&x.level===l&&!usedG.has(x.grp));if(c.length){const f=c.filter(x=>!seen.has(x.id));q=sample(f.length?f:c);break}}
    if(!q){const any=bank.filter(x=>!usedG.has(x.grp));if(any.length){const f=any.filter(x=>!seen.has(x.id));q=sample(f.length?f:any)}}
    if(q){usedG.add(q.grp);out.push(q)}}
  out.sort((a,b)=>a.level-b.level);
  store.set('seen_'+id,[...out.map(q=>q.id),...seenArr].slice(0,Math.max(0,Math.floor(bank.length*.6))));
  return {bank,qs:out.map(q=>{const c={...q};if(q.type==='mcq'){c.correct=q.options[0];c.opts=shuffle(q.options)}if(q.type==='match')c.right=shuffle(q.pairs.map(p=>p[1]));if(q.type==='order')c.shuf=shuffle(q.items);return c})};
}
const LV={1:['سهل','l1'],2:['متوسط','l2'],3:['متقدم','l3']};
function renderQuestion(box,q,L,finish){
  if(q.type==='mcq'||q.type==='tf'){const opts=q.type==='tf'?['صح','خطأ']:q.opts,corr=q.type==='tf'?(q.answer?'صح':'خطأ'):q.correct;
    box.innerHTML=`<div class="opts ${q.type==='tf'?'tf':''}">${opts.map((o,k)=>`<button class="opt" data-v="${esc(o)}"><span class="k">${q.type==='tf'?(k?'✗':'✓'):'أبجد'[k]}</span><span>${o}</span></button>`).join('')}</div>`;
    $$('.opt',box).forEach(o=>o.onclick=()=>{$$('.opt',box).forEach(x=>{x.disabled=true;if(x.dataset.v===corr)x.classList.add('right')});if(o.dataset.v!==corr)o.classList.add('wrong');finish(o.dataset.v===corr)})}
  if(q.type==='hot'){box.innerHTML=`<div class="hot-wrap"><div class="fig hot">${L.parts.scene()}</div></div>`;let d=false;
    $$('.pp',box).forEach(p=>p.addEventListener('click',()=>{if(d)return;d=true;p.classList.add('picked');const ok=p.dataset.part===q.answer;if(!ok)$$(`.pp[data-part="${q.answer}"]`,box).forEach(x=>x.classList.add('picked'));finish(ok)}))}
  if(q.type==='match'){const cols=['#0F6F78','#3C86D3','#B87A0E','#D0384A'];const pair={};let left=null;
    box.innerHTML=`<p class="muted small" style="margin-bottom:.4rem">المس عنصراً ثم المس ما يناسبه.</p><div class="match"><div class="col">${q.pairs.map((p,k)=>`<button class="mitem" data-l="${k}">${p[0]}</button>`).join('')}</div><div class="col">${q.right.map(t=>`<button class="mitem" data-r="${esc(t)}">${t}</button>`).join('')}</div></div><div class="row" style="margin-top:.7rem"><button class="btn" id="chkM" disabled>تحقّق</button></div>`;
    const paint=()=>{$$('[data-l]',box).forEach(x=>{const k=+x.dataset.l;x.classList.toggle('sel',left===k);x.classList.toggle('paired',k in pair);x.style.setProperty('--pc',cols[k]);x.innerHTML=q.pairs[k][0]+(k in pair?`<span class="tag">${k+1}</span>`:'')});
      $$('[data-r]',box).forEach(x=>{const k=Object.keys(pair).find(kk=>pair[kk]===x.dataset.r);x.classList.toggle('paired',k!=null);if(k!=null)x.style.setProperty('--pc',cols[k]);x.innerHTML=x.dataset.r+(k!=null?`<span class="tag">${+k+1}</span>`:'')});
      $('#chkM',box).disabled=Object.keys(pair).length<q.pairs.length};
    $$('[data-l]',box).forEach(x=>x.onclick=()=>{left=+x.dataset.l;Sound.tap();paint()});
    $$('[data-r]',box).forEach(x=>x.onclick=()=>{if(left==null)return;Object.keys(pair).forEach(k=>{if(pair[k]===x.dataset.r)delete pair[k]});pair[left]=x.dataset.r;left=null;Sound.tap();paint()});
    $('#chkM',box).onclick=()=>{$$('.mitem',box).forEach(x=>x.disabled=true);$('#chkM',box).hidden=true;let ok=true;$$('[data-l]',box).forEach(x=>{const k=+x.dataset.l,g=pair[k]===q.pairs[k][1];if(!g)ok=false;x.style.setProperty('--pc',g?'var(--ok)':'var(--bad)');x.classList.add('paired')});finish(ok)};paint()}
  if(q.type==='order'){let ans=[];
    box.innerHTML=`<p class="muted small" style="margin-bottom:.4rem">المس البطاقات بالترتيب. المس بطاقة في القائمة المرتبة لإعادتها.</p><div class="pool"></div><div class="slots" style="margin-top:.6rem"></div><div class="row" style="margin-top:.7rem"><button class="btn" id="chkO" disabled>تحقّق</button></div>`;
    const paint=()=>{$('.pool',box).innerHTML=q.shuf.filter(t=>!ans.includes(t)).map(t=>`<button class="dchip" data-t="${esc(t)}">${t}</button>`).join('')||'<span class="muted small">رُتّبت كل البطاقات</span>';
      $('.slots',box).innerHTML=q.items.map((_,i)=>`<button class="slot ${ans[i]?'full':''}" data-i="${i}" style="cursor:pointer;text-align:right;font:inherit">${ans[i]||''}</button>`).join('');
      $$('.pool .dchip',box).forEach(b=>b.onclick=()=>{ans.push(b.dataset.t);Sound.tap();paint()});
      $$('.slot',box).forEach(s=>s.onclick=()=>{const i=+s.dataset.i;if(ans[i]&&!$('#chkO',box).hidden){ans.splice(i,1);paint()}});
      $('#chkO',box).disabled=ans.length<q.items.length};
    paint();$('#chkO',box).onclick=()=>{$('#chkO',box).hidden=true;const ok=ans.every((t,i)=>t===q.items[i]);$$('.slot',box).forEach((s,i)=>{s.disabled=true;s.style.borderColor=ans[i]===q.items[i]?'var(--ok)':'var(--bad)'});finish(ok)}}
}
function stageQuiz(host,L,id,show){
  const intro=()=>{const best=ProgressService.best(id),bank=genBank(L,id);
    host.innerHTML=`<div class="card stack" style="max-width:46rem;margin:auto">
     <span class="eyebrow">تقويم الدرس</span><h2>هل أنت مستعد لاختبار ما تعلّمته؟</h2>
     <p class="muted">${Settings.get('qcount')} أسئلة تبدأ سهلة وتزداد صعوبة، وتقيس أهداف الدرس كلها (${L.objectives.length} أهداف). كل الأسئلة مبنية على ما شاهدته في الدرس، وتتغير في كل محاولة من بنك فيه ${bank.length} سؤالاً.</p>
     <div class="row"><span class="chip l1">سهل</span><span class="chip l2">متوسط</span><span class="chip l3">متقدم</span>${best!=null?`<span class="chip">أفضل نتيجة: ${best}%</span>`:''}</div>
     <div><button class="btn" id="startQ">ابدأ الاختبار</button></div></div>`;
    $('#startQ',host).onclick=()=>run(buildQuiz(L,id).qs)};
  const run=qs=>{let i=0;const res=[];
    const next=()=>{if(i>=qs.length)return report(qs,res);const q=qs[i];
      host.innerHTML=`<div class="card" style="max-width:48rem;margin:auto">
       <div class="qhead"><span style="font-weight:700;font-variant-numeric:tabular-nums">سؤال ${i+1} من ${qs.length}</span><span class="row" style="gap:.35rem"><span class="chip ${LV[q.level][1]}">${LV[q.level][0]}</span><span class="chip">الهدف ${q.obj}</span></span></div>
       <div class="progress" style="margin-top:.6rem"><i style="width:${i/qs.length*100}%"></i></div>
       <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><p class="qtext">${q.text}</p>${speakBtn(q.text+(q.opts?' '+q.opts.join('، '):''))}</div>
       <div id="qbody"></div><div id="fb"></div></div>`;
      const finish=ok=>{res.push({id:q.id,obj:q.obj,level:q.level,ok});if(ok){Sound.ok();ProgressService.addPoints(5*q.level)}else Sound.bad();
        $('#fb',host).innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'إجابة صحيحة!':'ليست صحيحة.'}</b><span>${q.explain}</span></div><div class="row" style="justify-content:flex-end;margin-top:.7rem"><button class="btn" id="nq">${i+1<qs.length?'السؤال التالي':'اعرض النتيجة'}</button></div>`;
        $('#nq',host).onclick=()=>{i++;next();window.scrollTo({top:0})};$('#fb',host).scrollIntoView({block:'nearest',behavior:'smooth'})};
      renderQuestion($('#qbody',host),q,L,finish)};next()};
  const report=(qs,res)=>{const c=res.filter(r=>r.ok).length,pct=Math.round(c/res.length*100),stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
    ProgressService.saveResult(id,{at:Date.now(),pct,res});if(pct>=80)ProgressService.award('أتقنت: '+DataService.meta(id).t);Sound.win();
    host.innerHTML=`<div class="grid g2" style="max-width:58rem;margin:auto">
     <div class="card stack" style="justify-items:center;text-align:center;align-content:center">
      <span class="eyebrow">نتيجتك</span><div class="big-score">${pct}%</div><div class="stars">${[0,1,2].map(k=>star(k<stars)).join('')}</div>
      <p>${c} إجابات صحيحة من ${res.length}</p><p class="muted">${pct>=90?'ممتاز! أتقنت الدرس.':pct>=70?'أحسنت! راجع الأهداف المظللة لتصل إلى الإتقان.':'لا بأس، العالِم يتعلم من المحاولة. راجع الدرس ثم أعد الاختبار.'}</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">اختبار جديد</button><button class="btn ghost" id="rev">راجع الملخص</button></div></div>
     <div class="card stack"><span class="eyebrow">تحصيلك في أهداف الدرس</span><div class="report-obj">${L.objectives.map((o,k)=>{const r=res.filter(x=>x.obj===k+1),ok=r.filter(x=>x.ok).length,m=r.length&&ok===r.length;
      return `<div class="r"><span class="cnum" style="width:2rem;height:2rem;font-size:.9rem">${k+1}</span><span class="small" style="min-width:0">${o}</span><span class="status ${m?'ok':'no'}">${m?'أتقنته':'راجعه'} ${ok}/${r.length}</span></div>`}).join('')}</div></div></div>`;
    $('#again',host).onclick=()=>run(buildQuiz(L,id).qs);$('#rev',host).onclick=()=>{show(3);window.scrollTo({top:0})}};
  intro();
}

VIEWS.about=()=>{
  const badges=ProgressService.badges();
  view.innerHTML=`<section class="card credit" style="max-width:46rem;margin:auto">
   ${EMBLEM_SRC?`<img src="${EMBLEM_SRC}" alt="شعار مملكة البحرين" style="width:min(10rem,40vw)">`:`<svg class="flag" viewBox="0 0 500 300" role="img" aria-label="علم مملكة البحرين"><rect width="500" height="300" fill="#CE1126"/><path d="M0 0H125L200 30L125 60L200 90L125 120L200 150L125 180L200 210L125 240L200 270L125 300H0Z" fill="#FFFFFF"/></svg>`}
   <span class="eyebrow">مملكة البحرين · وفق مناهج وزارة التربية والتعليم</span>
   <h1>مختبر العلوم الصغير</h1><p class="muted">تصميم وإعداد</p><p class="name">الأستاذة مها الخزاعي</p>
   <div class="card" style="background:var(--surface-2);text-align:right;width:100%"><h3 style="margin-bottom:.4rem">حقوق الاستخدام</h3>
    <p class="small">جميع الحقوق محفوظة © 2026 الأستاذة مها الخزاعي. يُسمح باستخدام البرنامج لأغراض تعليمية غير تجارية في المدارس والمنازل. لا يجوز نسخه أو تعديله أو بيعه أو إعادة نشره دون إذن كتابي من المعد. المحتوى العلمي مبني على كتب العلوم المقررة من وزارة التربية والتعليم في مملكة البحرين، وهي المرجع الأصلي.</p></div>
   ${badges.length?`<div class="stack" style="justify-items:center"><span class="eyebrow">شاراتك</span><div class="row" style="justify-content:center">${badges.map(b=>`<span class="chip">${b}</span>`).join('')}</div></div>`:''}
   <p class="muted small">الإصدار 0.3 · الصفوف من الأول إلى الثالث</p></section>`;
};

VIEWS.landing=()=>{document.body.classList.add('landing');onCleanup(()=>document.body.classList.remove('landing'));
  view.innerHTML=`<section class="land">
   <div class="land-top"><div class="moe"><img src="${EMBLEM_SRC}" alt="شعار مملكة البحرين"><span>وزارة التربية والتعليم</span></div></div>
   <div class="land-main">
    <div class="land-text">
     <span class="eyebrow">علوم الصفوف الابتدائية · من الصف الأول إلى الصف الثالث</span>
     <h1 class="land-title">مختبر العلوم الصغير</h1>
     <p class="land-sub">دروس تفاعلية ومجسمات وتجارب افتراضية وأدوات وألعاب، وفق منهج العلوم في مملكة البحرين.</p>
     <button class="btn land-go" data-go="home">ادخل إلى البرنامج</button>
     <div class="land-credit"><span>تصميم وإعداد</span><b>الأستاذة مها الخزاعي</b></div>
    </div>
    <div class="land-art">${LES['g1-p1-c1-l1'].cover()}</div>
   </div></section>`;
};

/* ---------- الإعدادات ---------- */
VIEWS.settings=()=>{
  const S=Settings;const row=(t,d,ctl)=>`<div class="set-row"><div class="lbl"><b>${t}</b><span>${d}</span></div><div>${ctl}</div></div>`;
  const segH=(k,opts)=>`<div class="seg" data-set="${k}">${opts.map(([v,n])=>`<button data-v="${v}" aria-pressed="${String(S.get(k))===String(v)}">${n}</button>`).join('')}</div>`;
  const tog=(k)=>`<div class="seg" data-set="${k}" data-bool="1"><button data-v="true" aria-pressed="${!!S.get(k)}">تشغيل</button><button data-v="false" aria-pressed="${!S.get(k)}">إيقاف</button></div>`;
  view.innerHTML=`<div class="lesson-head"><div><span class="eyebrow">خصّص البرنامج لنفسك</span><h1>الإعدادات</h1></div></div>
  <div class="grid g2" style="align-items:start">
   <section class="card stack"><h2>الخط والقراءة</h2>
    ${row('حجم الخط','يكبّر الخطوط والأزرار والمسافات معاً.',`<div id="scaleBox" style="min-width:min(100%,16rem)"></div>`)}
    <div class="stack" style="gap:.4rem"><b>نوع خط النصوص</b><div class="font-pick" data-font="font">${Object.entries(FONTS).filter(([k])=>k!=='kufi').map(([k,[f,d]])=>`<button data-v="${k}" aria-pressed="${S.get('font')===k}" style="font-family:'${f}'"><b>${f==='IBM Plex Sans Arabic'?'بلكس':f==='Noto Naskh Arabic'?'نسخ':f==='Tajawal'?'تجوال':f==='Cairo'?'القاهرة':'المراعي'}</b><small>${d}</small></button>`).join('')}</div></div>
    <div class="stack" style="gap:.4rem"><b>نوع خط العناوين</b><div class="font-pick" data-font="head">${Object.entries(FONTS).map(([k,[f,d]])=>`<button data-v="${k}" aria-pressed="${S.get('head')===k}" style="font-family:'${f}'"><b>${f==='IBM Plex Sans Arabic'?'بلكس':f==='Noto Naskh Arabic'?'نسخ':f==='Tajawal'?'تجوال':f==='Cairo'?'القاهرة':f==='Almarai'?'المراعي':'كوفي'}</b><small>${d}</small></button>`).join('')}</div></div>
    ${row('تباعد الحروف والأسطر','مسافات أوسع تسهّل القراءة.',tog('spacing'))}
    ${row('إظهار التشكيل','يعرض النصوص مشكولة لتسهيل القراءة. القراءة الصوتية تستخدم التشكيل دائماً.',tog('tashkeel'))}
    <div class="preview"><h3 style="margin-bottom:.3rem">معاينة: النباتات وأجزاؤها</h3><p>الجذر يثبّت النبات في التربة، ويمتص منها الماء والأملاح المعدنية.</p></div>
   </section>
   <section class="stack">
    <div class="card stack"><h2>المظهر</h2>
     ${row('السمة','فاتحة أو داكنة أو حسب إعداد الجهاز.',segH('theme',[['auto','تلقائي'],['light','فاتح'],['dark','داكن']]))}
     ${row('تباين عالٍ','ألوان أوضح وحدود أسمك.',tog('hc'))}
     ${row('تقليل الحركة','يوقف الرسوم المتحركة في الواجهة.',tog('calm'))}</div>
    <div class="card stack"><h2>الصوت</h2>
     ${row('المؤثرات الصوتية','أصوات الإجابة الصحيحة والخاطئة.',`<div class="seg" id="sfx"><button data-v="1" aria-pressed="${Sound.on}">تشغيل</button><button data-v="0" aria-pressed="${!Sound.on}">إيقاف</button></div>`)}
     ${row('القراءة التلقائية','يقرأ البرنامج الشرح بصوت عالٍ عند لمس الرسوم.',tog('autoRead'))}
     ${row('سرعة القراءة','سرعة صوت قراءة النصوص.',segH('rate',[[.7,'بطيئة'],[.9,'عادية'],[1.1,'سريعة']]))}
     <div><button class="btn ghost sm" data-say="مرحباً، أنا صوت مختبر العلوم الصغير.">جرّب الصوت</button></div></div>
    <div class="card stack"><h2>التعلّم</h2>

    const [db,room,user]=await Promise.all([claude.use('db'),claude.use('room'),claude.use('user')]);
    Live.db=db;Live.room=room;Live.user=user;Live.admin=user?!!(await user.canEdit()):false}catch(e){}
  return Live})());
Live.ok=()=>!!(Live.db&&Live.room);
const myTok=()=>{let k=store.get('ctok',null);if(!k){k='s'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);store.set('ctok',k)}return k};
const plain=h=>{const d=document.createElement('div');d.innerHTML=String(h);return (d.textContent||'').replace(/\s+/g,' ').trim()};
const rankSort=rows=>rows.slice().sort((a,b)=>(b.s||0)-(a.s||0)||(b.c||0)-(a.c||0)||(a.tm||1e12)-(b.tm||1e12));
const fmtSec=ms=>ms==null?'—':(ms/1000).toFixed(1)+' ث';
const ST={lobby:['بانتظار البدء','l2'],live:['جارية الآن','l1'],ended:['انتهت','l3']};
function boardHTML(rows,total,meK){
  if(!rows.length)return '<p class="muted">لا يوجد مشاركون.</p>';
  return `<ol class="lb">${rankSort(rows).map((r,i)=>`<li class="${r.k===meK?'me':''} ${i<3?'top'+(i+1):''}"><span class="rk">${i+1}</span><span class="nm"><span><b>${esc(r.n)}</b>${r.k===meK?' <span class="chip">أنت</span>':''}</span><small class="muted">${r.c||0} من ${total} صحيحة · ${fmtSec(r.tm)}${r.d===false?' · لم يُكمل':''}</small></span><span class="sc">${r.s||0}</span></li>`).join('')}</ol>`;
}
function compBlocked(host,msg){host.innerHTML=`<div class="lesson-head"><div><span class="eyebrow">مسابقات مباشرة</span><h1>المسابقات</h1></div></div><section class="card stack" style="max-width:44rem">${msg}</section>`}

const inClaude=()=>!!(window.claude&&typeof claude.use==='function');
VIEWS.compete=(arg)=>{
  if(!inClaude())return fbView(arg);
  arg=arg||{};
  view.innerHTML=`<div class="lesson-head"><div><span class="eyebrow">مسابقات مباشرة</span><h1>المسابقات</h1></div></div><section class="card"><p class="muted">جارٍ الاتصال بخدمة المسابقات…</p></section>`;
  const root=view.firstElementChild;
  Live.init().then(()=>{if(!root.isConnected)return;
    if(!Live.ok())return compBlocked(view,`<h2>المسابقات المباشرة غير متاحة هنا</h2><p>تعمل المسابقات أونلاين عند فتح البرنامج من رابطه على Claude بعد تسجيل الدخول، لأنها تحتاج إلى اتصال مشترك بين المعلم والطلاب.</p><p class="muted small">بقية أجزاء البرنامج (الدروس والأدوات والألعاب) تعمل كالمعتاد.</p><div><button class="btn ghost" data-go="games">اذهب إلى الألعاب</button></div>`);
    if(arg.manage&&Live.admin)return compManage(arg.manage);
    if(arg.join)return compJoin(arg.join);
    compHome(arg.tab||(Live.admin?'admin':'join'));
  });
};

/* ---------- الصفحة الرئيسية للمسابقات ---------- */
function compHome(tab){
  const admin=Live.admin;
  view.innerHTML=`<div class="lesson-head"><div><span class="eyebrow">مسابقات مباشرة</span><h1>${tab==='admin'?'لوحة إدارة المسابقات':'المسابقات'}</h1></div>
   ${admin?`<div class="seg" id="ctab"><button data-t="admin" aria-pressed="${tab==='admin'}">لوحة المعلم</button><button data-t="join" aria-pressed="${tab==='join'}">انضم كطالب</button></div>`:''}</div><div id="cbody"></div>`;
  if(admin)$('#ctab').onclick=e=>{const b=e.target.closest('button');if(b){Sound.tap();go('compete',{tab:b.dataset.t})}};
  const body=$('#cbody');
  // قائمة المسابقات (تحديث مباشر)
  let comps=[];const listeners=[];
  const unsub=Live.db.collection('comps').orderBy('created','desc').limit(40).onSnapshot(s=>{comps=s.docs.filter(d=>d.exists).map(d=>d.data());listeners.forEach(f=>f())},()=>{});
  onCleanup(unsub);
  if(tab==='admin'&&admin)adminHome(body,()=>comps,f=>listeners.push(f));
  else joinHome(body,()=>comps,f=>listeners.push(f));
}

function buildCompQs(ids,n){
  const pools=ids.map(id=>quizPool(id));const out=[],seen=new Set();let k=0,guard=0;
  while(out.length<n&&guard++<500){const p=pools[k++%pools.length];if(!p.length){if(pools.every(x=>!x.length))break;continue}
    const q=p.shift();const t=plain(q.text);if(seen.has(t))continue;seen.add(t);
    if(q.type==='tf')out.push({t,o:['صح','خطأ'],a:q.answer?0:1});
    else{const opts=shuffle(q.options.map(plain));out.push({t,o:opts,a:opts.indexOf(plain(q.options[0]))})}}
  return shuffle(out);
}

/* ---------- لوحة المعلم: إدارة مسابقة ---------- */
function compManage(code){
  const ref=Live.db.doc('comps/'+code);let C=null,peers=[],stats={},wq=Promise.resolve(),rTimer=null,tick=null,ending=false;
  const W=patch=>wq=wq.then(()=>ref.update(patch)).catch(()=>toast('تعذّر حفظ التغيير'));
  let root;
  view.innerHTML=`<div class="lesson-head"><div><span class="eyebrow">لوحة المعلم</span><h1 id="mT">…</h1></div><button class="btn ghost sm" data-go="compete">رجوع إلى المسابقات</button></div>
   <div class="grid g2" style="align-items:start">
    <section class="card stack"><div class="codebox"><span class="muted small">رمز المسابقة</span><div class="code-big" id="mCode">${esc(code)}</div><span class="chip" id="mSt"></span></div>
     <div class="muted small" id="mInfo"></div><div id="mMaxBox"></div><div class="row" id="mAct"></div><div id="mAsk"></div></section>
    <section class="card stack"><div class="row" style="justify-content:space-between"><h2 id="mPT">المشاركون</h2><span class="pill" id="mCount">0</span></div><div id="mPlayers"></div></section>
   </div>`;
  const mx=slider('الحد الأقصى للطلبة',2,60,20,1,v=>v+' طالباً',v=>{clearTimeout(mx._t);mx._t=setTimeout(()=>{if(C&&C.status==='lobby'&&v!==C.max)W({max:v})},450)});$('#mMaxBox').appendChild(mx);
  const cands=()=>peers.filter(p=>!p.sameTab&&p.presence&&p.presence.comp===code&&typeof p.presence.k==='string'&&p.presence.n).map(p=>({k:String(p.presence.k).slice(0,40),n:String(p.presence.n).slice(0,20),j:+p.presence.j||0,i:+p.presence.i||0,s:+p.presence.s||0,c:+p.presence.c||0,d:!!p.presence.d,tm:+p.presence.tm||0}));
  const syncRoster=()=>{if(!C||C.status!=='lobby')return;const seen=new Set(),list=[];
    cands().sort((a,b)=>a.j-b.j).forEach(p=>{if(!seen.has(p.k)){seen.add(p.k);list.push({k:p.k,n:p.n})}});
    const roster=list.slice(0,C.max);if(JSON.stringify(roster)!==JSON.stringify(C.roster||[])){clearTimeout(rTimer);rTimer=setTimeout(()=>W({roster}),500)}};
  const total=()=>(C&&C.qs||[]).length;
  const collect=()=>{if(!C||C.status!=='live')return;const inR=new Set((C.roster||[]).map(r=>r.k));let changed=false;
    cands().forEach(p=>{if(!inR.has(p.k))return;const o=stats[p.k];if(!o||o.i!==p.i||o.s!==p.s||o.d!==p.d){if(!o||o.d!==p.d)changed=true;stats[p.k]={...p,n:(C.roster.find(r=>r.k===p.k)||p).n}}});
    if(changed){W({board:Object.values(stats).map(({k,n,s,c,d,tm,i})=>({k,n,s,c,d,tm,i}))})}
    const R=C.roster||[];if(R.length&&R.every(r=>stats[r.k]&&stats[r.k].d))endComp()};
  const endComp=()=>{if(ending||!C||C.status!=='live')return;ending=true;
    const results=(C.roster||[]).map(r=>{const s=stats[r.k]||{};return {k:r.k,n:r.n,s:s.s||0,c:s.c||0,tm:s.tm||null,d:!!s.d}});
    W({status:'ended',endedAt:Date.now(),results:rankSort(results)}).then(()=>{Sound.win()})};
  const paint=()=>{if(!C||!root.isConnected)return;
    $('#mT').textContent=C.title;$('#mSt').textContent=ST[C.status][0];$('#mSt').className='chip '+ST[C.status][1];
    $('#mInfo').textContent=`الصف ${['','الأول','الثاني','الثالث'][C.grade]||''} · ${total()} سؤالاً · ${C.secs} ثانية لكل سؤال · الدروس: ${(C.names||[]).length>4?(C.names.slice(0,3).join('، ')+' و'+(C.names.length-3)+' دروس أخرى'):(C.names||[]).join('، ')}`;
    mx.style.display=C.status==='lobby'?'':'none';if(document.activeElement!==$('input',mx))mx.set(C.max);
    const act=$('#mAct');const R=C.roster||[];
    if(C.status==='lobby'){const c=cands(),seen=new Set(R.map(r=>r.k)),waiting=[];c.forEach(p=>{if(!seen.has(p.k)){seen.add(p.k);waiting.push(p)}});
      act.innerHTML=`<button class="btn sun" id="mStart" ${R.length?'':'disabled'}>ابدأ المسابقة الآن (${R.length})</button><button class="btn ghost" id="mDel">حذف المسابقة</button>`;
      $('#mPT').textContent='المشاركون في الانتظار';$('#mCount').textContent=`${R.length} / ${C.max}`;
      $('#mPlayers').innerHTML=(R.length?`<div class="plist">${R.map(r=>`<span class="pchip">${esc(r.n)}</span>`).join('')}</div>`:'<p class="muted">لم ينضم أحد بعد. اطلب من الطلاب إدخال الرمز <b>'+esc(code)+'</b>.</p>')+(waiting.length?`<p class="muted small" style="margin-top:.6rem">خارج القائمة لاكتمال العدد (${waiting.length}): ${waiting.map(w=>esc(w.n)).join('، ')}</p>`:'');
      $('#mStart').onclick=()=>{if(!R.length)return;W({status:'live',startedAt:Date.now(),board:[]});Sound.whoosh()};
      $('#mDel').onclick=()=>askDel()}
    else if(C.status==='live'){act.innerHTML=`<button class="btn" id="mEnd">إنهاء المسابقة وإعلان النتائج</button><span class="pill" id="mClock"></span>`;$('#mEnd').onclick=endComp;
      $('#mPT').textContent='الترتيب المباشر';const done=R.filter(r=>stats[r.k]&&stats[r.k].d).length;$('#mCount').textContent=`أنهى ${done} من ${R.length}`;
      const rows=R.map(r=>({...(stats[r.k]||{s:0,c:0,i:0}),k:r.k,n:r.n}));
      $('#mPlayers').innerHTML=`<ol class="lb">${rankSort(rows).map((r,i)=>`<li><span class="rk">${i+1}</span><span class="nm"><b>${esc(r.n)}</b><span class="mbar"><i style="width:${Math.round(100*(r.i||0)/Math.max(1,total()))}%"></i></span><small class="muted">${r.d?'أنهى ✓':`السؤال ${Math.min((r.i||0)+1,total())} من ${total()}`}</small></span><span class="sc">${r.s||0}</span></li>`).join('')}</ol>`}
    else{act.innerHTML=`<button class="btn sun" data-go="compete">مسابقة جديدة</button><button class="btn ghost" id="mDel">حذف المسابقة</button>`;$('#mDel').onclick=()=>askDel();
      $('#mPT').textContent='النتائج النهائية';$('#mCount').textContent=(C.results||[]).length+' مشاركاً';$('#mPlayers').innerHTML=boardHTML(C.results||[],total(),null)}};
  const askDel=()=>{$('#mAsk').innerHTML=`<div class="feedback no"><b>حذف المسابقة ونتائجها نهائياً؟</b><div class="row"><button class="btn sm" id="dY">نعم، احذف</button><button class="btn ghost sm" id="dN">إلغاء</button></div></div>`;
    $('#dN').onclick=()=>$('#mAsk').innerHTML='';$('#dY').onclick=async()=>{try{await ref.delete();toast('حُذفت المسابقة');go('compete')}catch(e){toast('تعذّر الحذف')}}};
  root=view.firstElementChild;
  const u1=ref.onSnapshot(s=>{if(!s.exists){if(C)go('compete');else compBlocked(view,'<h2>المسابقة غير موجودة</h2><div><button class="btn" data-go="compete">رجوع</button></div>');return}
    const prev=C&&C.status;C=s.data();if(C.status==='live'&&prev!=='live'&&Array.isArray(C.board))C.board.forEach(b=>{if(!stats[b.k])stats[b.k]={...b}});
    paint();syncRoster();collect()},()=>{});
  const u2=Live.room.onPeers(ch=>{peers=ch.peers;syncRoster();collect();paint()},()=>{});peers=Live.room.peers();
  tick=setInterval(()=>{if(C&&C.status==='live'&&C.startedAt){const el=$('#mClock');const left=Math.max(0,Math.round((C.startedAt+total()*C.secs*1000+30000-Date.now())/1000));if(el)el.textContent='الوقت المتبقي '+left+' ث';if(!left)endComp()}},1000);
  onCleanup(()=>{u1();u2();clearInterval(tick);clearTimeout(rTimer)});
}

/* ---------- الطالب: قائمة المسابقات المفتوحة ---------- */
function joinHome(body,getComps,onComps){
  const name=Settings.get('name');
  if(!name){body.innerHTML=`<section class="card stack" style="max-width:40rem"><h2>اكتب اسمك أولاً</h2><p>للمشاركة في المسابقات أونلاين مع زملائك، يجب كتابة اسمك في صفحة الإعدادات. سيظهر اسمك في لوحة الترتيب لجميع المشاركين.</p><div><button class="btn sun" data-go="settings">اذهب إلى الإعدادات</button></div></section>`;return}
  body.innerHTML=`<div class="grid g2" style="align-items:start"><section class="card stack"><h2>انضم برمز المسابقة</h2><p class="muted">ستشارك باسم: <b>${esc(name)}</b> <button class="btn ghost sm" data-go="settings">تغيير</button></p>
    <div class="row"><input id="jCode" class="inp code-in" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="رمز المسابقة"><button class="btn sun" id="jGo">انضمام</button></div><div class="feedback no" id="jErr" hidden></div></section>
   <section class="card stack"><h2>مسابقات مفتوحة الآن</h2><div id="jList" class="stack" style="gap:.5rem"></div></section></div>`;
  const tryJoin=async c=>{c=(c||'').replace(/\D/g,'');if(c.length!==4){$('#jErr').hidden=false;$('#jErr').textContent='الرمز مكوّن من 4 أرقام.';return}
    const s=await Live.db.doc('comps/'+c).get().catch(()=>null);if(!s||!s.exists){$('#jErr').hidden=false;$('#jErr').textContent='لا توجد مسابقة بهذا الرمز. تأكد منه مع معلمك.';Sound.bad();return}
    go('compete',{join:c})};

function compJoin(code){
  const name=Settings.get('name');if(!name)return go('compete',{tab:'join'});
  const k=myTok(),ref=Live.db.doc('comps/'+code),R=Live.room,pkey='cp_'+code;
  let C=null,P=store.get(pkey,null)||{i:0,s:0,c:0,tm:0,d:false},qT=null,qStart=0,phase='';
  const pres=()=>R.presence({comp:code,k,n:name.slice(0,20),j:P.j||(P.j=Date.now()),i:P.i,s:P.s,c:P.c,d:P.d,tm:P.tm}).catch(()=>{});
  const save=()=>store.set(pkey,P);
  view.innerHTML=`<div class="lesson-head"><div><span class="eyebrow">مسابقة مباشرة · الرمز ${esc(code)}</span><h1 id="pT">…</h1></div><button class="btn ghost sm" id="pLeave">مغادرة</button></div><div id="pBody"></div>`;
  const root=view.firstElementChild;const body=$('#pBody');
  $('#pLeave').onclick=()=>go('compete',{tab:'join'});
  const inRoster=()=>(C.roster||[]).some(r=>r.k===k);
  const livePeers=()=>R.peers().filter(p=>p.presence&&p.presence.comp===code&&p.presence.k).map(p=>({k:String(p.presence.k),n:String(p.presence.n||'').slice(0,20),s:+p.presence.s||0,c:+p.presence.c||0,d:!!p.presence.d,tm:+p.presence.tm||0}));
  const myRank=()=>{const ks=new Set((C.roster||[]).map(r=>r.k));const rows=livePeers().filter(r=>ks.has(r.k));if(!rows.some(r=>r.k===k))rows.push({k,n:name,s:P.s,c:P.c,tm:P.tm});const s=rankSort(rows);return [s.findIndex(r=>r.k===k)+1,s.length]};
  const render=()=>{if(!C||!root.isConnected)return;$('#pT').textContent=C.title;const tot=(C.qs||[]).length;
    if(C.status==='lobby'){phase='lobby';const R0=C.roster||[];
      if(inRoster())body.innerHTML=`<section class="card stack center-card"><div class="pulse-dot"></div><h2>أنت في قائمة المتسابقين!</h2><p>انتظر حتى يبدأ المعلم المسابقة. ستظهر الأسئلة تلقائياً.</p><div class="row" style="justify-content:center"><span class="pill">${R0.length} / ${C.max} مشاركاً</span><span class="pill">${tot} سؤالاً</span><span class="pill">${C.secs} ث لكل سؤال</span></div><div class="plist" style="justify-content:center">${R0.map(r=>`<span class="pchip ${r.k===k?'me':''}">${esc(r.n)}</span>`).join('')}</div></section>`;
      else if(R0.length>=C.max)body.innerHTML=`<section class="card stack center-card"><h2>اكتمل عدد المشاركين</h2><p>وصلت هذه المسابقة إلى الحد الأقصى (${C.max} مشاركاً) الذي حدده المعلم. إذا غادر أحد المشاركين ستدخل تلقائياً.</p></section>`;
      else body.innerHTML=`<section class="card stack center-card"><div class="pulse-dot"></div><h2>جارٍ تسجيلك…</h2><p class="muted">يُضاف اسمك عندما تكون لوحة المعلم مفتوحة.</p></section>`;
      return}
    if(C.status==='live'){if(!inRoster()){phase='out';body.innerHTML=`<section class="card stack center-card"><h2>بدأت المسابقة</h2><p>لم تكن ضمن قائمة المشاركين عند البدء. يمكنك متابعة النتائج عند انتهائها.</p></section>`;return}
      if(P.d){phase='wait';const [r,n]=myRank();body.innerHTML=`<section class="card stack center-card"><h2>أحسنت! أنهيت المسابقة</h2><div class="row" style="justify-content:center"><span class="pill">نقاطك: <b>${P.s}</b></span><span class="pill">${P.c} من ${tot} صحيحة</span><span class="pill">ترتيبك الآن: <b>${r}</b> من ${n}</span></div><p class="muted">انتظر حتى ينهي الجميع أو يعلن المعلم النتائج.</p></section>`;return}
      if(phase!=='play'){phase='play';ask()}return}
    if(C.status==='ended'){phase='ended';clearInterval(qT);const res=C.results||[];const me=rankSort(res).findIndex(r=>r.k===k);
      body.innerHTML=`<section class="card stack"><div class="result-head">${me>=0?`<div class="big-rank ${me<3?'top'+(me+1):''}">${me+1}</div><div><h2>ترتيبك ${me+1} من ${res.length}</h2><p class="muted">${me===0?'مبروك! أنت الأول في المسابقة.':me<3?'رائع! أنت من الثلاثة الأوائل.':'أحسنت المشاركة، استمر في التعلّم!'}</p></div>`:'<h2>النتائج النهائية</h2>'}</div>${boardHTML(res,tot,k)}<div class="row"><button class="btn ghost" id="pBack">مسابقات أخرى</button></div></section>`;
      $('#pBack').onclick=()=>go('compete',{tab:'join'});if(me>=0&&me<3&&!P.cel){P.cel=1;save();Sound.win()}}};
  const ask=()=>{const tot=C.qs.length;if(P.i>=tot){P.d=true;save();pres();Sound.win();phase='';render();return}
    const q=C.qs[P.i];qStart=Date.now();
    body.innerHTML=`<section class="card stack"><div class="row" style="justify-content:space-between"><span class="pill">السؤال ${P.i+1} من ${tot}</span><span class="pill">النقاط: <b>${P.s}</b></span></div>
      <div class="qbar"><i id="qb"></i></div><p class="qtext">${esc(q.t)}</p><div class="opts ${q.o.length===2?'tf':''}">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${q.o.length===2?(j?'✗':'✓'):'أبجد'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="qf"></div></section>`;
    const lim=C.secs*1000;let over=false;
    const finish=j=>{if(over)return;over=true;clearInterval(qT);const el=Date.now()-qStart,ok=j===q.a;
      $$('.opt',body).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('right')});if(j!=null&&!ok)$(`.opt[data-j="${j}"]`,body).classList.add('wrong');
      const pts=ok?100+Math.round(50*Math.max(0,lim-el)/lim):0;P.i++;P.s+=pts;P.c+=ok?1:0;P.tm+=Math.min(el,lim);save();pres();ok?Sound.ok():Sound.bad();
      $('#qf',body).innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?`إجابة صحيحة! +${pts}`:j==null?'انتهى الوقت':'إجابة غير صحيحة'}</b></div>`;
      setTimeout(()=>{if(root.isConnected&&C.status==='live')ask()},1300)};
    $$('.opt',body).forEach(b=>b.onclick=()=>finish(+b.dataset.j));
    clearInterval(qT);qT=setInterval(()=>{const left=lim-(Date.now()-qStart);const b=$('#qb',body);if(b)b.style.width=Math.max(0,100*left/lim)+'%';if(left<=0)finish(null)},100)};
  pres();
  const u1=ref.onSnapshot(s=>{if(!s.exists){body.innerHTML='<section class="card"><h2>هذه المسابقة لم تعد موجودة</h2></section>';return}C=s.data();if(P.cr!==C.created){P={i:0,s:0,c:0,tm:0,d:false,cr:C.created};save();pres()}render()},()=>{});
  const u2=R.onPeers(()=>{if(phase==='wait')render()},()=>{});
  onCleanup(()=>{u1();u2();clearInterval(qT);R.presence({comp:null,k:null,n:null,j:null,i:null,s:null,c:null,d:null,tm:null}).catch(()=>{})});
}

/* ---------- الطالب: غرفة المسابقة واللعب ---------- */
function fbJoin(code){
  const name=Settings.get('name');if(!name)return go('compete',{join:code});
  let C=null,P=[],me=null,phase='',qT=null,claiming=false,full=false,had=false,root,stopTick=null;
  view.innerHTML=`<div class="lesson-head"><div><span class="eyebrow">مسابقة مباشرة · الرمز ${esc(code)}</span><h1 id="pT">…</h1></div><button class="btn ghost sm" id="pLeave">مغادرة</button></div><div id="pBody"><section class="card"><p class="muted">جارٍ الانضمام…</p></section></div>`;
  root=view.firstElementChild;const body=$('#pBody');$('#pLeave').onclick=()=>go('compete',{tab:'join'});
  FB.ensure().then(u=>{if(!root.isConnected)return;const uid=u.uid,myRef=FB.db.ref('players/'+code+'/'+uid);
    const claim=async()=>{if(claiming||full||me)return;claiming=true;
      try{const r=await FB.db.ref('seats/'+code).transaction(c=>{c=c||0;if(!C||c>=C.max)return;return c+1});
        if(!r.committed){full=true;render();return}
        await myRef.set({n:name.slice(0,20),sl:r.snapshot.val(),j:FB.TS(),i:0,s:0,c:0,tm:0,st:0,d:false})}
      catch(e){full=true;render()}finally{claiming=false}};
    const myRank=()=>{const s=rankSort(P);return [s.findIndex(r=>r.k===uid)+1,s.length]};
    const render=()=>{if(!C||!root.isConnected)return;$('#pT').textContent=C.title;const tot=(C.qs||[]).length;
      if(isOver(C,P)){const first=phase!=='ended';phase='ended';clearInterval(qT);const res=rankSort(P);const k=res.findIndex(r=>r.k===uid);
        body.innerHTML=`<section class="card stack"><div class="result-head">${k>=0?`<div class="big-rank ${k<3?'top'+(k+1):''}">${k+1}</div><div><h2>ترتيبك ${k+1} من ${res.length}</h2><p class="muted">${k===0?'مبروك! أنت الأول في المسابقة.':k<3?'رائع! أنت من الثلاثة الأوائل.':'أحسنت المشاركة، استمر في التعلّم!'}</p></div>`:'<h2>النتائج النهائية</h2>'}</div><div id="pRes">${boardHTML(res,tot,uid)}</div><div class="row"><button class="btn ghost" id="pBack">مسابقات أخرى</button></div></section>`;
        $('#pBack').onclick=()=>go('compete',{tab:'join'});if(first&&k>=0&&k<3)Sound.win();return}
      if(C.status==='lobby'){phase='lobby';
        if(me)body.innerHTML=`<section class="card stack center-card"><div class="pulse-dot"></div><h2>أنت في قائمة المتسابقين!</h2><p>انتظر حتى يبدأ المعلم المسابقة. ستظهر الأسئلة تلقائياً.</p><div class="row" style="justify-content:center"><span class="pill">${P.length} / ${C.max} مشاركاً</span><span class="pill">${tot} سؤالاً</span><span class="pill">${C.secs} ث لكل سؤال</span></div><div class="plist" style="justify-content:center">${P.sort((a,b)=>(a.j||0)-(b.j||0)).map(r=>`<span class="pchip ${r.k===uid?'me':''}">${esc(r.n)}</span>`).join('')}</div></section>`;
        else if(had)body.innerHTML=`<section class="card stack center-card"><h2>أُزيل اسمك من المسابقة</h2><p>أزال المعلم اسمك من قائمة المشاركين. راجع معلمك إذا كان ذلك عن طريق الخطأ.</p></section>`;
        else if(full)body.innerHTML=`<section class="card stack center-card"><h2>اكتمل عدد المشاركين</h2><p>وصلت هذه المسابقة إلى الحد الأقصى (${C.max} مشاركاً) الذي حدده المعلم.</p></section>`;
        else{body.innerHTML=`<section class="card stack center-card"><div class="pulse-dot"></div><h2>جارٍ تسجيلك…</h2></section>`;claim()}
        return}
      if(C.status==='live'){if(!me){phase='out';body.innerHTML=`<section class="card stack center-card"><h2>بدأت المسابقة</h2><p>لم تكن ضمن قائمة المشاركين عند البدء. يمكنك متابعة النتائج عند انتهائها.</p></section>`;return}
        if(me.d){phase='wait';const [r,n]=myRank();body.innerHTML=`<section class="card stack center-card"><h2>أحسنت! أنهيت المسابقة</h2><div class="row" style="justify-content:center"><span class="pill">نقاطك: <b>${me.s}</b></span><span class="pill">${me.c} من ${tot} صحيحة</span><span class="pill">ترتيبك الآن: <b>${r}</b> من ${n}</span></div><p class="muted">انتظر حتى ينهي الجميع أو يعلن المعلم النتائج.</p></section>`;return}
        if(phase!=='play'){phase='play';ask()}}};
    const ask=()=>{const tot=C.qs.length,S={i:me.i||0,s:me.s||0,c:me.c||0,tm:me.tm||0,st:me.st||0};
      if(S.i>=tot){myRef.update({d:true}).catch(()=>{});return}
      const q=C.qs[S.i],T=qTime(q,C),lim=T*1000;let t0=Date.now(),over=false;
      if(stopTick){stopTick();stopTick=null}if(C.tick)stopTick=kTicker(()=>({active:!over,left:lim-(Date.now()-t0),T:lim}));
      body.innerHTML=`<section class="card stack kq-play"><div class="row" style="justify-content:space-between"><span class="pill">السؤال ${S.i+1} من ${tot}</span><span class="chip">${KT[q.k||'mcq'].ic} ${KT[q.k||'mcq'].n}</span><span class="pill">النقاط: <b>${S.s}</b></span></div>
        <div class="qbar"><i id="qb"></i></div><div id="qIn"></div><div id="qf"></div></section>`;
      const finish=v=>{if(over)return;over=true;clearInterval(qT);if(stopTick){stopTick();stopTick=null}const el=Date.now()-t0,ok=kCheck(q,v);S.st=ok?S.st+1:0;
        const pts=kPts(ok,el,T,S.st);S.i++;S.s+=pts;S.c+=ok?1:0;S.tm+=Math.min(el,lim);ok?Sound.ok():Sound.bad();
        $$('#qIn button',body).forEach(x=>x.disabled=true);
        $('#qf',body).innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?`إجابة صحيحة! +${pts}${S.st>1?` · 🔥 ${S.st}`:''}`:v==null?'انتهى الوقت':'إجابة غير صحيحة'}</b>${ok?'':`<span>الإجابة الصحيحة: ${esc(kAnsText(q))}</span>`}</div>`;
        const upd={i:S.i,s:S.s,c:S.c,tm:S.tm,st:S.st};if(S.i>=tot)upd.d=true;
        myRef.update(upd).catch(()=>toast('تعذّر حفظ إجابتك، تحقق من الاتصال'));
        setTimeout(()=>{if(!root.isConnected||phase!=='play')return;if(S.i>=tot){phase='';render()}else{me={...me,...upd};ask()}},ok?1300:2400)};
      if(!q.k){q.k=q.o&&q.o.length===2?'tf':'mcq'}
      kInput($('#qIn',body),q,finish);
      clearInterval(qT);qT=setInterval(()=>{const left=lim-(Date.now()-t0);const b=$('#qb',body);if(b)b.style.width=Math.max(0,100*left/lim)+'%';if(left<=0)finish(null)},100)};
    const u1=fbOn(FB.db.ref('comps/'+code),v=>{v=normC(v);if(!v){body.innerHTML='<section class="card"><h2>هذه المسابقة لم تعد موجودة</h2></section>';C=null;return}C=v;render()});
    const u2=fbOn(FB.db.ref('players/'+code),v=>{P=toList(v);const m=P.find(p=>p.k===uid)||null;if(m)had=true;
      if(phase==='play'){if(m)me={...m,...me};return}me=m;render()});
    const tick=setInterval(()=>{if(C&&C.status==='live'&&phase!=='play'&&phase!=='ended'&&isOver(C,P))render()},2000);
    onCleanup(()=>{u1();u2();clearInterval(qT);clearInterval(tick);stopTick&&stopTick()});
  }).catch(()=>{body.innerHTML='<section class="card stack"><h2>تعذّر الانضمام</h2><p>تحقق من الاتصال بالإنترنت ثم أعد المحاولة.</p></section>'});
}
/* ===================== محرك أسئلة المسابقات (على غرار كاهوت) =====================
   أنواع الأسئلة: mcq اختيار من متعدد · tf صح أو خطأ · order ترتيب · hot أين يقع؟ · sort تصنيف · match مطابقة
*/
const KT={
  mcq:{n:'اختيار من متعدد',T:20,ic:'◆'},tf:{n:'صح أو خطأ',T:10,ic:'✓✗'},order:{n:'ترتيب',T:30,ic:'↕'},
  hot:{n:'أين يقع؟',T:20,ic:'◎'},sort:{n:'تصنيف',T:40,ic:'⇄'},match:{n:'مطابقة',T:40,ic:'⇆'}};
const KORDER=['mcq','tf','order','hot','sort','match'];
const KCOL=[{c:'#E21B3C',s:'tri'},{c:'#1368CE',s:'dia'},{c:'#D89E00',s:'cir'},{c:'#26890C',s:'sq'}];
const KSH={tri:'<path d="M12 3 22.5 21h-21z"/>',dia:'<path d="M12 1.5 22.5 12 12 22.5 1.5 12z"/>',cir:'<circle cx="12" cy="12" r="10"/>',sq:'<rect x="2.5" y="2.5" width="19" height="19" rx="2"/>'};
const kShape=i=>`<svg class="ksh" viewBox="0 0 24 24" aria-hidden="true" fill="#fff">${KSH[KCOL[i%4].s]}</svg>`;
// تحويل الكائنات ذات المفاتيح الرقمية (كما تعيدها Firebase) إلى مصفوفات، بعمق
const deepArr=v=>{if(Array.isArray(v))return v.map(deepArr);if(v&&typeof v==='object'){const ks=Object.keys(v);
  if(ks.length&&ks.every(k=>/^\d+$/.test(k))){const a=[];ks.sort((x,y)=>x-y).forEach(k=>a[+k]=deepArr(v[k]));return a.filter(x=>x!==undefined)}
  const o={};ks.forEach(k=>o[k]=deepArr(v[k]));return o}return v};
const qTime=(q,C)=>+(q&&q.T)||+(C&&C.secs)||20;

/* ---------- توليد الأسئلة من بنوك الدروس ---------- */
function kPool(ids){
  const P={mcq:[],tf:[],order:[],hot:[],sort:[],match:[]};
  ids.forEach(lid=>{const L=LES[lid];if(!L)return;
    genBank(L,lid).forEach(q=>{const t=plain(q.text||'');if(!t)return;
      if(q.type==='mcq'&&q.options&&q.options.length>=2){const opts=shuffle(q.options.slice(0,4).map(plain));P.mcq.push({k:'mcq',t,o:opts,a:opts.indexOf(plain(q.options[0])),lid})}
      else if(q.type==='tf')P.tf.push({k:'tf',t,o:['صح','خطأ'],a:q.answer?0:1,lid});
      else if(q.type==='order'&&q.items&&q.items.length>=3)P.order.push({k:'order',t,items:q.items.map(plain),lid});
      else if(q.type==='hot'&&L.parts)P.hot.push({k:'hot',t,lid,ans:q.answer,name:(L.parts.items.find(x=>x[0]===q.answer)||[])[1]||''});
      else if(q.type==='match'&&q.pairs&&q.pairs.length>=3)P.match.push({k:'match',t:t||'طابق كل عنصر بما يناسبه',pairs:q.pairs.slice(0,4).map(p=>[plain(p[0]),plain(p[1])]),lid});
    });
    (L.groups||[]).forEach(g=>{if(!g.cats||g.cats.length<2)return;const two=shuffle(g.cats).slice(0,2);if(two.some(c=>!c[1]||c[1].length<2))return;
      const items=shuffle(two.flatMap((c,ci)=>shuffle(c[1]).slice(0,3).map(it=>[plain(it),ci])));
      P.sort.push({k:'sort',t:`صنّف العناصر في المجموعة المناسبة: ${plain(g.title||'')}`.replace(/:\s*$/,''),cats:two.map(c=>plain(c[0])),items,lid})});
  });
  Object.keys(P).forEach(k=>{const seen=new Set();P[k]=shuffle(P[k]).filter(q=>{const key=q.k+'|'+q.t+'|'+(q.ans||'');if(seen.has(key))return false;seen.add(key);return true})});
  return P;
}
function kPick(P,counts){const out=[];KORDER.forEach(k=>{const n=Math.min(counts[k]||0,P[k].length);for(let i=0;i<n;i++){const q={...P[k][i],T:KT[k].T};out.push(q)}});
  // توزيع الأنواع على امتداد المسابقة بدلاً من تجميعها
  const byK={};out.forEach(q=>(byK[q.k]=byK[q.k]||[]).push(q));const res=[];let more=true;while(more){more=false;KORDER.forEach(k=>{if(byK[k]&&byK[k].length){res.push(byK[k].shift());more=true}})}
  return res}

/* ---------- التصحيح والنقاط ---------- */
function kCheck(q,v){if(v==null)return false;
  if(q.k==='mcq'||q.k==='tf')return +v===q.a;
  if(q.k==='hot')return v===q.ans;
  if(q.k==='order')return Array.isArray(v)&&v.length===q.items.length&&v.every((x,i)=>x===q.items[i]);
  if(q.k==='sort')return Array.isArray(v)&&v.length===q.items.length&&v.every((c,i)=>+c===q.items[i][1]);
  if(q.k==='match')return Array.isArray(v)&&v.length===q.pairs.length&&v.every((b,i)=>b===q.pairs[i][1]);
  return false}
// مثل كاهوت: حتى 1000 نقطة حسب السرعة، ومكافأة سلسلة الإجابات الصحيحة (100 لكل إجابة متتالية، حتى 500)
function kPts(ok,ms,T,streak){if(!ok)return 0;const f=Math.min(1,Math.max(0,ms/(T*1000)));return Math.round(1000*(1-f/2))+Math.min(Math.max(streak-1,0),5)*100}
function kAnsText(q){
  if(q.k==='mcq'||q.k==='tf')return q.o[q.a];
  if(q.k==='hot')return q.name;
  if(q.k==='order')return q.items.join(' ← ');
  if(q.k==='sort')return q.cats.map((c,ci)=>`${c}: ${q.items.filter(x=>x[1]===ci).map(x=>x[0]).join('، ')}`).join(' · ');
  if(q.k==='match')return q.pairs.map(p=>`${p[0]} ← ${p[1]}`).join(' · ');return ''}

function kStage(q,reveal,dist){
  const tot=dist?dist.reduce((a,b)=>a+b,0):0;
  if(q.k==='mcq'||q.k==='tf'){const ci=i=>q.k==='tf'?(i?0:1):i;
    return `<div class="kopts big ${q.o.length===2?'two':''}">${q.o.map((o,i)=>`<div class="kopt ${reveal?(i===q.a?'right':'dim'):''}" style="--kc:${KCOL[ci(i)].c}">${kShape(ci(i))}<span>${esc(o)}</span>${reveal?`<b class="kcount">${dist?dist[i]||0:0}${i===q.a?' ✓':''}</b>`:''}</div>`).join('')}</div>`+
      (reveal&&dist?`<div class="kbars">${q.o.map((o,i)=>`<div class="kbar ${i===q.a?'right':''}" style="--kc:${KCOL[ci(i)].c}"><i style="height:${tot?Math.max(4,Math.round(100*(dist[i]||0)/tot)):4}%"></i><span>${kShape(ci(i))}${dist[i]||0}</span></div>`).join('')}</div>`:'')}
  if(q.k==='hot'){const L=LES[q.lid];return `<div class="hot-wrap kh"><div class="fig ${reveal?'':'hot'}" id="kHot">${L&&L.parts?L.parts.scene():''}</div></div>`}
  if(q.k==='order')return reveal?`<ol class="korder">${q.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:`<div class="plist kshow">${shuffle(q.items.slice()).map(t=>`<span class="pchip">${esc(t)}</span>`).join('')}</div>`;
  if(q.k==='sort')return `<div class="kbins">${q.cats.map((c,ci)=>`<div class="kbin" style="--kc:${KCOL[ci?0:1].c}"><b>${esc(c)}</b><div class="kin">${reveal?q.items.filter(x=>x[1]===ci).map(x=>`<span class="pchip">${esc(x[0])}</span>`).join(''):''}</div></div>`).join('')}</div>`+(reveal?'':`<div class="plist kshow">${q.items.map(x=>`<span class="pchip">${esc(x[0])}</span>`).join('')}</div>`);
  if(q.k==='match')return reveal?`<div class="kpairs">${q.pairs.map((p,i)=>`<div style="--kc:${KCOL[i%4].c}"><b>${esc(p[0])}</b><span>←</span><b>${esc(p[1])}</b></div>`).join('')}</div>`:`<div class="match"><div class="col">${q.pairs.map(p=>`<span class="mitem">${esc(p[0])}</span>`).join('')}</div><div class="col">${shuffle(q.pairs.map(p=>p[1])).map(t=>`<span class="mitem">${esc(t)}</span>`).join('')}</div></div>`;
  return ''}

function kTicker(getState){let tm=null,stopped=false,flip=0;
  const run=()=>{if(stopped)return;const st=getState();if(!st||!st.active||st.left<=0){tm=setTimeout(run,120);return}
    const f=clamp(st.left/st.T,0,1);flip^=1;const fr=(flip?900:680)+(1-f)*460;Sound.tone([fr],.032,'square',.05+.09*(1-f));
    if(st.left<5200&&flip)Sound.tone([fr*1.5],.02,'sine',.05);
    tm=setTimeout(run,105+800*Math.pow(f,1.3))};
  run();return()=>{stopped=true;clearTimeout(tm)}}

      if(me)body.innerHTML=`<section class="kfb wait"><div class="pulse-dot"></div><h2>أنت في المسابقة!</h2><p>اسمك يظهر الآن على شاشة المعلم. انتظر حتى تبدأ المسابقة.</p><div class="kname">${esc(me.n)}</div><span class="pill">${P.length} / ${C.max} لاعباً</span></section>`;
      else if(had)body.innerHTML=`<section class="kfb no"><h2>أُزيل اسمك من المسابقة</h2><p>راجع معلمك إذا كان ذلك عن طريق الخطأ.</p></section>`;
      else if(full)body.innerHTML=`<section class="kfb no"><h2>اكتمل عدد المشاركين</h2><p>وصلت المسابقة إلى الحد الأقصى (${C.max}) الذي حدده المعلم.</p></section>`;
      else{body.innerHTML=`<section class="kfb wait"><div class="pulse-dot"></div><h2>جارٍ تسجيلك…</h2></section>`;if(!claiming){claiming=true;fbClaimSeat(code,C,uid,name).then(ok=>{if(!ok){full=true;shown='';paint()}}).catch(()=>{full=true;shown='';paint()}).finally(()=>{claiming=false})}}
      return}
    if(!me){body.innerHTML=`<section class="kfb no"><h2>بدأت المسابقة</h2><p>لم تكن ضمن المشاركين عند البدء. يمكنك مشاهدة النتائج على شاشة المعلم.</p></section>`;return}
    if(ph==='q'){const q=C.qs[C.qi];
      if(myA){body.innerHTML=`<section class="kfb wait"><div class="pulse-dot"></div><h2>أُرسلت إجابتك ✓</h2><p>انتظر حتى ينتهي الوقت…</p></section>`;return}
      body.innerHTML=`<section class="card stack kq-play"><div class="row" style="justify-content:space-between"><span class="pill">السؤال ${C.qi+1} من ${C.qs.length}</span><span class="chip">${KT[q.k].ic} ${KT[q.k].n}</span><span class="pill ktime" id="pTm"></span></div>
        <div class="qbar"><i id="pQb"></i></div><div id="pIn"></div><div class="kready" id="pReady"><span>استعد!</span><b id="pRN">3</b></div></section>`;
      kInput($('#pIn'),q,submit);return}
    if(ph==='rev'||ph==='board'){const q=C.qs[C.qi];const [r,n]=rank();
      if(myA&&myA.ok)body.innerHTML=`<section class="kfb ok"><h2>إجابة صحيحة!</h2><div class="kpts">+${myA.p}</div>${me.st>1?`<span class="kstreak big">🔥 سلسلة ${me.st} إجابات صحيحة</span>`:''}<p>أنت في المركز <b>${r}</b> من ${n}</p></section>`;
      else body.innerHTML=`<section class="kfb no"><h2>${myA?'إجابة غير صحيحة':'انتهى الوقت'}</h2><p class="kright">الإجابة الصحيحة: <b>${esc(kAnsText(q))}</b></p><p>أنت في المركز <b>${r}</b> من ${n}</p><p class="muted">لا بأس، السؤال القادم فرصة جديدة!</p></section>`;
      if(!myA&&(me.st||0)>0&&me.lq!==C.qk)FB.db.ref('players/'+code+'/'+uid).update({st:0}).catch(()=>{});
      if(ph==='rev')(myA&&myA.ok?Sound.ok:Sound.bad).call(Sound);return}
    if(ph==='end'){const [r,n]=rank();const R=rankSort(P);
      body.innerHTML=`<section class="card stack"><div class="result-head"><div class="big-rank ${r<=3?'top'+r:''}">${r}</div><div><h2>ترتيبك ${r} من ${n}</h2><p class="muted">${r===1?'مبروك! أنت بطل المسابقة 🏆':r<=3?'رائع! أنت على منصة الفائزين.':'أحسنت المشاركة، استمر في التعلّم!'}</p></div></div>${boardHTML(R.map(r=>({...r,d:undefined})),C.qs.length,uid)}<div class="row"><button class="btn ghost" id="pBack">مسابقات أخرى</button></div></section>`;
      $('#pBack').onclick=()=>go('compete',{tab:'join'});if(r<=3)Sound.win()}};
  FB.ensure().then(u=>{if(!root.isConnected)return;uid=u.uid;
    const u1=fbOn(FB.db.ref('comps/'+code),v=>{if(!v){body.innerHTML='<section class="kfb no"><h2>هذه المسابقة لم تعد موجودة</h2></section>';C=null;return}C=deepArr(v);watchMine();paint()});
    const u2=fbOn(FB.db.ref('players/'+code),v=>{P=toList(v);me=P.find(p=>p.k===uid)||null;if(me)had=true;paint()});
    tick=setInterval(()=>{if(!C||C.phase!=='q'||myA)return;const q=C.qs[C.qi],T=qTime(q),now=FB.now(),rd=$('#pReady');if(!rd)return;
      if(now<C.qAt){rd.hidden=false;$('#pRN').textContent=Math.ceil((C.qAt-now)/1000);return}rd.hidden=true;
      const left=C.qAt+T*1000-now;const b=$('#pQb');if(b)b.style.width=Math.max(0,100*left/(T*1000))+'%';const tm=$('#pTm');if(tm)tm.textContent=Math.max(0,Math.ceil(left/1000))+' ث';
      if(left<=0&&!$('#pIn .kdone')){const pi=$('#pIn');if(pi){pi.classList.add('kdone');$$('button',pi).forEach(x=>x.disabled=true)}}},150);
    onCleanup(()=>{u1();u2();uA&&uA();clearInterval(tick)});
  }).catch(()=>{body.innerHTML='<section class="kfb no"><h2>تعذّر الانضمام</h2><p>تحقق من الاتصال بالإنترنت ثم أعد المحاولة.</p></section>'});
}
$('#pts').textContent=ProgressService.getPoints();paintSound();VOC.show(Settings.get('tashkeel'));{let pin=null;try{pin=new URLSearchParams(location.search).get('pin')}catch(e){}if(pin&&/^\d{4}$/.test(pin)&&!inClaude())go('compete',{join:pin});else go('landing')}Live.init();
</script>
</body></html>
