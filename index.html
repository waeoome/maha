<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="مختبر العلوم الصغير — برنامج تفاعلي لعلوم الصفوف الابتدائية في مملكة البحرين. تصميم وإعداد: الأستاذة مها الخزاعي"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>مختبر العلوم الصغير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&family=Almarai:wght@400;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: دفتر مختبر. كل المقاسات بوحدة rem، وحجم الخط الأساسي يتغير مع عرض الشاشة وارتفاعها معاً */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF2F5; --ink:#14232E; --muted:#5B6B77; --line:#DCE3E9;
  --leaf:#0F6F78; --leaf-deep:#0A4F56; --red:#B3122E; --sun:#D9A13B; --sky:#2F6FB0;
  --ok:#1C8A5A; --bad:#C23B4A; --warn:#A8701A;
  --sky1:#BFE3FF; --sky2:#F0F9FF; --ground1:#8BCB63; --ground2:#5DA444; --soil1:#B5845A; --soil2:#7A5233; --stage:#F7FBF9;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif; --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:1rem; --tap:3rem;
  --fig-h:clamp(14rem,50vh,34rem);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E171D; --surface:#152229; --surface-2:#1B2B33; --ink:#E7EEF2; --muted:#98A9B3; --line:#283A44;
  --leaf:#3CB4B8; --leaf-deep:#9ADDE0; --red:#F0606E; --sun:#E9B856; --sky:#6AAEF0; --ok:#4CC28A; --bad:#FF7A86; --warn:#E9B856;
  --sky1:#183A57; --sky2:#2A5677; --ground1:#4F8F3A; --ground2:#3A6E2B; --soil1:#8A6240; --soil2:#5A3D25; --stage:#13221B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171D; --surface:#152229; --surface-2:#1B2B33; --ink:#E7EEF2; --muted:#98A9B3; --line:#283A44;
  --leaf:#3CB4B8; --leaf-deep:#9ADDE0; --red:#F0606E; --sun:#E9B856; --sky:#6AAEF0; --ok:#4CC28A; --bad:#FF7A86; --warn:#E9B856;
  --sky1:#183A57; --sky2:#2A5677; --ground1:#4F8F3A; --ground2:#3A6E2B; --soil1:#8A6240; --soil2:#5A3D25; --stage:#13221B; color-scheme:dark}

/* الخط الأساسي يتكيف مع الجهاز: 14px على الهواتف الصغيرة حتى 21px على الشاشات الكبيرة */
html{font-size:calc(clamp(14px,calc(8.5px + .38vw + .5vh),21px) * var(--fscale,1));-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.75;direction:rtl;background:radial-gradient(60rem 30rem at 85% -10%,color-mix(in srgb,var(--leaf) 9%,transparent),transparent 70%),var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(1.55rem,1.2rem + 1.4vw,2.3rem)} h2{font-size:clamp(1.25rem,1.1rem + .6vw,1.6rem)} h3{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit}
svg text{font-family:var(--f-body);direction:ltr}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:.6rem}
.wrap{max-width:75rem;margin:0 auto;padding-inline:max(1rem,env(safe-area-inset-left,0px));padding-block:1rem 7rem}

/* شريط علوي */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:75rem;margin:0 auto;padding:.4rem 1rem;display:flex;align-items:center;gap:.6rem}
.brand{display:flex;align-items:center;gap:.6rem;background:none;border:0;cursor:pointer;padding:0;min-height:var(--tap);min-width:0}
.brand svg{width:2.4rem;height:2.4rem;flex:none}
.brand b{font-family:var(--f-display);font-size:1.3rem;color:var(--leaf-deep);font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:.72rem;color:var(--muted);margin-top:-.35rem;white-space:nowrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.3rem .8rem;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;min-height:2.4rem;white-space:nowrap}
.pill svg{width:1.2rem;height:1.2rem}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:.85rem;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:1.35rem;height:1.35rem}
.soundbtn{display:inline-flex;align-items:center;gap:.4rem;min-height:var(--tap);padding:0 .8rem;border-radius:.85rem;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.85rem;white-space:nowrap}
.soundbtn svg{width:1.3rem;height:1.3rem}
.soundbtn[aria-pressed="false"]{color:var(--bad)}
.nav{display:flex;gap:.2rem}
.nav button{border:0;background:none;padding:.4rem .7rem;border-radius:.75rem;cursor:pointer;min-height:var(--tap);display:flex;align-items:center;gap:.35rem;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button[aria-current="true"]{color:var(--leaf-deep);background:var(--surface-2)}
.nav svg{width:1.4rem;height:1.4rem}
@media (max-width:62rem){
  .top .nav{position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom,0px))}
  .nav button{flex-direction:column;gap:0;font-size:.72rem;padding:.2rem .3rem}
  .brand small{display:none}
}
@media (max-width:30rem){.brand b{font-size:1.1rem}.soundbtn span{display:none}.soundbtn{padding:0 .6rem}}

/* عناصر عامة */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(.85rem,2.2vw,1.4rem);min-width:0}
.btn{min-height:var(--tap);padding:.55rem 1.2rem;border-radius:.85rem;border:2px solid transparent;background:var(--leaf);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;transition:transform .12s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--leaf-deep);border-color:var(--line)}
.btn.sun{background:var(--sun);color:#3A2600}
.btn.sm{min-height:2.5rem;padding:.3rem .9rem;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.8rem;letter-spacing:.03em;color:var(--leaf);font-weight:600}
.grid{display:grid;gap:.9rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr))}
.stack{display:grid;gap:.75rem;align-content:start}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:.1rem .65rem;font-size:.78rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.l1{color:var(--ok)} .chip.l2{color:var(--warn)} .chip.l3{color:var(--red)}
.section-title{display:flex;align-items:baseline;gap:.6rem;margin:1.6rem 0 .75rem;flex-wrap:wrap}

/* الرئيسية */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:1.1rem;align-items:center}
@media (max-width:48rem){.hero{grid-template-columns:1fr}}
.hero h1 em{font-style:normal;color:var(--leaf)}
.hero-art{background:var(--surface);border:1px solid var(--line);border-radius:1.5rem;overflow:hidden;max-width:28rem;justify-self:center;width:100%}
.hero-art svg{display:block;width:100%;height:auto;max-height:42vh}
.grade-card{text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:.35rem;min-height:9rem}
.grade-card .num{font-family:var(--f-display);font-size:3rem;line-height:1;color:var(--leaf);font-weight:800}
.grade-card:hover{border-color:var(--leaf)}
.bar{height:.4rem;border-radius:.4rem;background:var(--surface-2);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--leaf)}

/* الصف */
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tabs button{min-height:var(--tap);padding:.4rem 1rem;border-radius:.75rem;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.chapter{display:grid;gap:.6rem;align-content:start}
.chapter-head{display:flex;gap:.75rem;align-items:center}
.cnum{width:2.6rem;height:2.6rem;border-radius:.75rem;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--leaf-deep);flex:none}
.lesson-row{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:.75rem;background:var(--surface-2);flex-wrap:wrap}
.lesson-row .t{flex:1;min-width:8rem;font-weight:500}
.lesson-row .pg{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson-row.ready{background:color-mix(in srgb,var(--leaf) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--leaf) 35%,transparent)}
.note{font-size:.85rem;color:var(--warn)}

/* الدرس */
.lesson-head{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:end;margin-bottom:.8rem}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin-bottom:.9rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.6rem);z-index:5}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:.75rem;min-height:var(--tap);cursor:pointer;padding:.25rem;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:.35rem}
.stepper button b{font-family:var(--f-display);font-size:1rem}
.stepper button[aria-current="step"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stepper button.done{color:var(--leaf-deep);border-color:var(--leaf)}
@media (max-width:34rem){.stepper button span{display:none}}
.stage-nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem}
.obj-list{display:grid;gap:.5rem;padding:0;margin:0;list-style:none;counter-reset:o}
.obj-list li{display:flex;gap:.6rem;align-items:flex-start;counter-increment:o}
.obj-list li::before{content:counter(o);flex:none;width:1.75rem;height:1.75rem;border-radius:.5rem;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--leaf-deep);font-size:.85rem}

/* مساحة الرسم: ارتفاعها يتبع ارتفاع الشاشة دائماً */
/* الرسم يأخذ عرض الشاشة كاملاً بنسبته الأصلية، ولا يتجاوز ارتفاعه جزءاً من ارتفاع الشاشة */
.fig{position:relative;width:100%;aspect-ratio:var(--ar,16/10);height:auto;max-height:var(--fig-h);min-height:11rem;margin-inline:auto;border-radius:var(--r);background:var(--stage);border:1px solid var(--line);overflow:hidden;touch-action:manipulation}
.fig>svg{display:block;width:100%;height:100%}
.fig.drag{touch-action:none}
.fig canvas{display:block;width:100%;height:100%}
.fig-sm{--fig-h:clamp(11rem,34vh,22rem)}
.fig.tall{--ar:4/5;--fig-h:clamp(18rem,64vh,36rem)}
@media (orientation:landscape) and (max-height:34rem){.fig{--fig-h:72vh}.fig.tall{--ar:5/4}}
.cover{width:100%;height:clamp(11rem,34vh,20rem);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--stage)}
.cover svg{display:block;width:100%;height:100%}
.explore{display:grid;gap:.9rem;grid-template-columns:1fr}
@media (min-width:56rem),(orientation:landscape) and (min-width:40rem){
  .explore{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
  .explore .side{position:sticky;top:8rem}
}
.ctrls{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:.8rem;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;min-height:2.6rem;padding:.3rem .85rem;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.ctl{display:grid;gap:.1rem;min-width:min(100%,12rem);flex:1}
.ctl label{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:.5rem}
.ctl label b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--leaf);min-height:2.4rem}
.infobox{border-radius:var(--r);padding:.8rem 1rem;background:color-mix(in srgb,var(--leaf) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--leaf) 30%,transparent);display:grid;gap:.35rem;min-height:5.5rem}
.infobox h3{color:var(--leaf-deep)}
.facts{display:grid;gap:.45rem;margin:0;padding:0;list-style:none}
.facts li{display:flex;gap:.5rem;align-items:flex-start;padding:.45rem .6rem;border-radius:.7rem;background:var(--surface-2);font-size:.92rem;transition:background .3s,box-shadow .3s}
.facts li.hl{background:color-mix(in srgb,var(--sun) 25%,var(--surface));box-shadow:inset 0 0 0 2px var(--sun)}
.facts li span{flex:1;min-width:0}
.tag3d{position:absolute;transform:translate(-50%,-50%);background:var(--surface);border:2px solid var(--leaf);color:var(--ink);font-weight:600;font-size:.8rem;padding:.05rem .6rem;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .2s}
.tag3d.off{opacity:0}
.hintbar{position:absolute;top:.5rem;inset-inline:.5rem;text-align:center;font-size:.78rem;color:var(--muted);pointer-events:none}
.hotdot{cursor:pointer}
.hotdot circle.ring{animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.tap-card{cursor:pointer;position:relative;transition:transform .45s ease,opacity .45s ease}
.tap-card.go{transform:perspective(44rem) rotateY(80deg) scale(.85);opacity:0}
.touch-hint{position:absolute;inset:auto 0 .8rem 0;margin:auto;width:max-content;max-width:90%;background:var(--sun);color:#3A2600;padding:.3rem .9rem;border-radius:999px;font-weight:600;font-size:.88rem;animation:pulse 1.6s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.06)}}
.pp{transition:filter .2s}
.hot .pp{cursor:pointer}
.hot .pp:hover,.pp.picked{filter:drop-shadow(0 0 .4rem #F2B233) brightness(1.08)}

/* الأنشطة */
.pool{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;min-height:3.2rem;padding:.5rem;border-radius:var(--r);background:var(--surface-2)}
.dchip{min-height:var(--tap);padding:.35rem 1rem;border-radius:999px;border:2px solid var(--leaf);background:var(--surface);font-weight:600;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dchip.sel{background:var(--leaf);color:#fff}
.dchip.placed{cursor:default;border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.dragghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 .5rem 1.2rem rgba(0,0,0,.2)}
.bins{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr))}
.bin{border:2px dashed var(--line);border-radius:var(--r);padding:.6rem;min-height:7rem;display:flex;flex-direction:column;gap:.4rem;cursor:pointer;background:var(--surface)}
.bin h4{margin:0;font-family:var(--f-display);font-size:1rem;color:var(--leaf-deep);text-align:center}
.bin .items{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.bin.over{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 8%,var(--surface))}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-.35rem)}75%{transform:translateX(.35rem)}}
.slots{display:grid;gap:.45rem;counter-reset:s}
.slot{min-height:var(--tap);border:2px dashed var(--line);border-radius:.8rem;display:flex;align-items:center;gap:.6rem;padding:.3rem .7rem;counter-increment:s;background:var(--surface)}
.slot::before{content:counter(s);width:1.7rem;height:1.7rem;border-radius:.5rem;background:var(--surface-2);display:grid;place-items:center;font-weight:700;flex:none}
.slot.full{border-style:solid;border-color:var(--ok)}
.tgt rect{fill:var(--surface);stroke:var(--leaf);stroke-width:2;stroke-dasharray:6 5;cursor:pointer}
.tgt.fill rect{fill:color-mix(in srgb,var(--leaf) 18%,var(--surface));stroke-dasharray:0}
.tgt text{font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.lead{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 4}

/* التقويم */
.qhead{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
.progress{height:.6rem;border-radius:.6rem;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.qtext{font-size:clamp(1.1rem,1rem + .5vw,1.4rem);font-family:var(--f-display);font-weight:700;margin:.8rem 0;flex:1;min-width:0}
.opts{display:grid;gap:.6rem}
.opt{min-height:3.3rem;text-align:right;padding:.6rem .9rem;border-radius:.85rem;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;display:flex;gap:.7rem;align-items:center}
.opt .k{flex:none;width:1.9rem;height:1.9rem;border-radius:.55rem;background:var(--surface-2);display:grid;place-items:center;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--leaf)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt[disabled]{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.feedback{margin-top:.8rem;padding:.7rem 1rem;border-radius:.85rem;display:grid;gap:.2rem}
.feedback.ok{background:color-mix(in srgb,var(--ok) 13%,var(--surface));border:1px solid var(--ok)}
.feedback.no{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.match .col{display:grid;gap:.45rem;align-content:start}
.mitem{min-height:var(--tap);padding:.4rem .7rem;border-radius:.75rem;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:right;font-weight:500;font-size:.92rem}
.mitem.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--surface))}
.mitem.paired{border-color:var(--pc)}
.mitem .tag{display:inline-block;width:1.35rem;height:1.35rem;border-radius:.4rem;background:var(--pc);color:#fff;text-align:center;line-height:1.35rem;font-size:.72rem;margin-inline-start:.35rem}
.hot-wrap{max-width:22rem;margin:0 auto}
.hot-wrap .fig{--fig-h:clamp(13rem,42vh,24rem)}
.report-obj{display:grid;gap:.5rem}
.report-obj .r{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;padding:.55rem .7rem;border-radius:.75rem;background:var(--surface-2)}
.status{font-size:.76rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;white-space:nowrap}
.status.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.status.no{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.big-score{font-family:var(--f-display);font-size:clamp(2.6rem,2rem + 3vw,4rem);font-weight:800;color:var(--leaf);line-height:1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:.25rem}.stars svg{width:2.1rem;height:2.1rem}

/* الألعاب والأدوات */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;max-width:40rem;margin:0 auto;width:100%}
@media (max-width:30rem){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:3/4;max-height:24vh;perspective:40rem;border:0;background:none;padding:0;cursor:pointer;width:100%}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.flip .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:.85rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:.35rem;text-align:center;font-weight:600;font-size:clamp(.72rem,.68rem + .35vw,.95rem);line-height:1.35}
.mcard .f{background:var(--leaf);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25) 0 12%,transparent 13%),radial-gradient(circle at 70% 70%,rgba(255,255,255,.18) 0 9%,transparent 10%)}
.mcard .b{background:var(--surface);border:2px solid var(--line);transform:rotateY(180deg)}
.mcard.done .b{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.timer{font-family:var(--f-display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--red)}
select{font:inherit;min-height:var(--tap);border-radius:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.2rem .7rem;max-width:100%}
.lens-box{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-2);border:1px solid var(--line);touch-action:none;cursor:none;max-width:34rem;margin:0 auto;width:100%}
.lens{position:absolute;width:9rem;height:9rem;border-radius:50%;border:.3rem solid var(--ink);overflow:hidden;pointer-events:none;box-shadow:0 .6rem 1.8rem rgba(0,0,0,.25);background:var(--surface-2)}
.lens .zoom{position:absolute;top:0;left:0;transform-origin:0 0}
.flash{perspective:56rem;max-width:26rem;margin:0 auto;width:100%}
.flash .in{position:relative;height:clamp(10rem,30vh,15rem);transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:1.2rem;text-align:center}
.flash .f{background:var(--leaf);color:#fff}.flash .f b{font-family:var(--f-display);font-size:clamp(1.6rem,1.3rem + 1.4vw,2.4rem)}
.flash .b{background:var(--surface);border:2px solid var(--leaf);transform:rotateY(180deg)}
.mock{border-style:dashed}
.flag{width:min(13rem,55vw);height:auto;border-radius:.4rem;box-shadow:0 .4rem 1.1rem rgba(0,0,0,.18)}
.credit{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.85rem}
.credit .name{font-family:var(--f-display);font-size:clamp(1.8rem,1.4rem + 1.5vw,2.6rem);color:var(--leaf-deep);font-weight:800}
.toast{position:fixed;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:1rem;font-weight:600;z-index:60;animation:fadein .3s;max-width:calc(100vw - 2rem);text-align:center;font-size:.9rem}
@keyframes fadein{from{opacity:0;transform:translate(-50%,.5rem)}}
.speaking{animation:pulse .8s ease-in-out infinite;border-color:var(--leaf)!important;color:var(--leaf)}
.fallback{padding:1.5rem;text-align:center;color:var(--muted)}
.drift{animation:drift 16s ease-in-out infinite alternate}.drift2{animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(26px)}}
.swayT{transform-box:fill-box;transform-origin:50% 100%;animation:swayT 4.5s ease-in-out infinite}
@keyframes swayT{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.pulseG{transform-box:fill-box;transform-origin:center;animation:pulseG 3s ease-in-out infinite}@keyframes pulseG{50%{transform:scale(1.08);opacity:.8}}
/* الصفحة الأولى */
body.landing .top{display:none}
body.landing .wrap{padding-block:0}
.land{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-block:1rem 1.5rem}
.land-top{display:flex;justify-content:flex-start}
.moe{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.moe img{width:clamp(3rem,2.5rem + 2vw,4.2rem);height:auto;background:#fff;border-radius:.6rem;padding:.25rem;box-shadow:0 .2rem .6rem rgba(0,0,0,.08)}
.moe span{font-size:.72rem;color:var(--muted);font-weight:500;white-space:nowrap}
.land-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.1rem;padding-block:.5rem}
.land-text{display:flex;flex-direction:column;align-items:center;gap:.8rem;max-width:44rem}
.land-title{font-size:clamp(2.3rem,1.4rem + 4.4vw,4.4rem);color:var(--leaf-deep);line-height:1.2;font-weight:800}
.land-sub{color:var(--muted);font-size:clamp(1rem,.9rem + .4vw,1.2rem);max-width:36rem}
.land-go{font-size:1.1rem;min-height:3.3rem;padding-inline:2.4rem;border-radius:999px;box-shadow:0 .6rem 1.4rem color-mix(in srgb,var(--leaf) 35%,transparent)}
.land-credit{display:flex;flex-direction:column;align-items:center;gap:.1rem;margin-top:.4rem}
.land-credit::before{content:"";width:3rem;height:3px;border-radius:3px;background:var(--sun);margin-bottom:.6rem}
.land-credit span{font-size:.85rem;color:var(--muted);letter-spacing:.02em}
.land-credit b{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,1.05rem + 1vw,1.8rem);color:var(--ink)}
.land-art{width:100%;max-width:40rem;border-radius:1.4rem;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:0 1rem 2.5rem rgba(20,35,46,.12)}
.land-art svg{display:block;width:100%;height:auto;max-height:28vh}
/* إعدادات الطالب */
html.calm *{animation:none!important;transition:none!important}
html.hc{--muted:var(--ink);--line:#7A8A94}
html.hc .card,html.hc .opt,html.hc .btn.ghost{border-width:2px}
html.wide-gap body{letter-spacing:.02em;word-spacing:.12em;line-height:2}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem 1rem;align-items:center;padding-block:.7rem;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lbl b{display:block}.set-row .lbl span{font-size:.82rem;color:var(--muted)}
@media (max-width:40rem){.set-row{grid-template-columns:1fr}}
.font-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr));gap:.5rem}
.font-pick button{border:2px solid var(--line);background:var(--surface);border-radius:.8rem;padding:.6rem;cursor:pointer;min-height:4.2rem;text-align:center}
.font-pick button[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 9%,var(--surface))}
.font-pick b{display:block;font-size:1.15rem}.font-pick small{color:var(--muted);font-size:.72rem}
.inp{min-height:var(--tap);border-radius:.75rem;border:1px solid var(--line);padding:.3rem .8rem;font:inherit;background:var(--surface);color:var(--ink);width:min(100%,16rem)}
.code-in{font-family:var(--f-display);font-size:1.6rem;font-weight:800;letter-spacing:.35em;text-align:center;width:9rem;direction:ltr}
.lpick{display:flex;flex-wrap:wrap;gap:.4rem;max-height:16rem;overflow:auto;padding:.1rem}
.lpick button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:.7rem;padding:.4rem .75rem;font:inherit;font-size:.88rem;cursor:pointer;min-height:2.4rem;text-align:right}
.lpick button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.crow{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;border:1px solid var(--line);border-radius:.85rem;background:var(--surface-2);flex-wrap:wrap}
.code-sm{font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:.12em;background:var(--leaf);color:#fff;border-radius:.6rem;padding:.25rem .55rem;direction:ltr}
.codebox{display:grid;justify-items:center;gap:.3rem;padding:1rem;border-radius:var(--r);background:linear-gradient(135deg,var(--leaf-deep),var(--leaf));color:#fff}
.codebox .muted{color:rgba(255,255,255,.8)}.codebox .chip{color:var(--ink)}
.code-big{font-family:var(--f-display);font-size:clamp(2.6rem,2rem + 3vw,4.2rem);font-weight:800;letter-spacing:.3em;direction:ltr;line-height:1.1;padding-inline-start:.3em}
.plist{display:flex;flex-wrap:wrap;gap:.4rem}
.pchip{border-radius:999px;padding:.3rem .8rem;background:var(--surface-2);border:1px solid var(--line);font-weight:600;animation:popIn .3s ease}
.xbtn{border:0;background:none;color:var(--bad);font:inherit;font-weight:800;cursor:pointer;padding:0 .2rem;margin-inline-start:.2rem}
.pchip.me{background:var(--leaf);color:#fff;border-color:var(--leaf)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.lb{list-style:none;padding:0;margin:0;display:grid;gap:.45rem}
.lb li{display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;border:1px solid var(--line);border-radius:.85rem;background:var(--surface)}
.lb li.me{border:2px solid var(--leaf);background:color-mix(in srgb,var(--leaf) 9%,var(--surface))}
.lb .rk{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface-2);font-variant-numeric:tabular-nums}
.lb li.top1 .rk,.big-rank.top1{background:#E2B33C;color:#3A2600}.lb li.top2 .rk,.big-rank.top2{background:#BFC7CF;color:#1d2a33}.lb li.top3 .rk,.big-rank.top3{background:#C98A55;color:#2b1606}
.lb .nm{flex:1;min-width:0;display:grid;gap:.15rem}.lb .nm b{overflow-wrap:anywhere}
.lb .sc{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--leaf-deep);font-variant-numeric:tabular-nums}
.mbar{display:block;height:.4rem;border-radius:9px;background:var(--surface-2);overflow:hidden}.mbar i{display:block;height:100%;background:var(--leaf);transition:width .4s}
.qbar{height:.55rem;border-radius:9px;background:var(--surface-2);overflow:hidden}.qbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--sun),var(--leaf));transition:width .1s linear}
.center-card{text-align:center;align-items:center;justify-items:center;max-width:44rem;margin-inline:auto}
.pulse-dot{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--leaf);animation:pdot 1.4s ease-out infinite}
@keyframes pdot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leaf) 55%,transparent)}100%{box-shadow:0 0 0 1.2rem transparent}}
.result-head{display:flex;align-items:center;gap:1rem}
.big-rank{flex:none;width:4.2rem;height:4.2rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:2rem;font-weight:800;background:var(--leaf);color:#fff}
html.calm .pchip,html.calm .pulse-dot{animation:none}
html.tash body{line-height:1.95}html.tash .qtext,html.tash h1,html.tash h2,html.tash h3{line-height:1.7}

/* ===== مسابقات كاهوت ===== */
.kstep{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--leaf);color:#fff;font-size:1rem;margin-inline-end:.4rem}
.kmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.6rem}
.kmodes button{display:grid;gap:.25rem;text-align:right;padding:.8rem 1rem;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.kmodes button span{font-size:.85rem;color:var(--muted)}
.kmodes button[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 9%,var(--surface))}
.ktypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.5rem}
.ktype{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:.85rem;background:var(--surface-2)}
.ktype>div:nth-child(2){flex:1;display:grid}.ktype.na{opacity:.55}
.kic{width:2.2rem;height:2.2rem;border-radius:.6rem;background:var(--leaf);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.kstepper{display:flex;align-items:center;gap:.35rem}.kstepper b{min-width:1.6rem;text-align:center;font-variant-numeric:tabular-nums}
.kstepper button{width:2.2rem;height:2.2rem;border-radius:.6rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.kq{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem;border:1px solid var(--line);border-radius:.85rem;background:var(--surface)}
.kqn{flex:none;width:2rem;height:2rem;border-radius:.55rem;background:var(--surface-2);display:grid;place-items:center;font-weight:800}
.kqb{flex:1;min-width:0}.kqt{font-weight:600;margin:.3rem 0}.kqa{display:grid;gap:.35rem;justify-items:end}
@media (max-width:40rem){.kq{flex-wrap:wrap}.kqa{width:100%;grid-auto-flow:column;justify-content:space-between}}
.kadd summary{list-style:none;display:inline-flex}.kadd summary::-webkit-details-marker{display:none}
.kopt-in{border-inline-start:.4rem solid var(--kc);padding-inline-start:.5rem;border-radius:.4rem}.kopt-in .ksh{width:1.3rem;height:1.3rem;fill:var(--kc)}
.kfoot{justify-content:center}.btn.big{min-height:3.4rem;font-size:1.1rem;padding-inline:1.6rem}
.ksh{width:1.7rem;height:1.7rem;flex:none}
.kopts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.kopt{display:flex;align-items:center;gap:.7rem;min-height:4.6rem;padding:.7rem 1rem;border-radius:.85rem;border:0;background:var(--kc);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;text-align:right;cursor:pointer;box-shadow:inset 0 -.3rem 0 rgba(0,0,0,.18);transition:transform .12s,opacity .2s}
.kopt:active{transform:scale(.97)}.kopt.dim{opacity:.3}.kopt.right{outline:.25rem solid var(--ok);outline-offset:.15rem}
.kopt span{flex:1}.kcount{font-size:1.3rem}
.kopts.big .kopt{min-height:5.5rem;font-size:clamp(1.05rem,.9rem + .8vw,1.6rem);cursor:default}
@media (max-width:30rem){.kopts{grid-template-columns:1fr}.kopts.two{grid-template-columns:1fr 1fr}}
.kbars{display:flex;justify-content:center;gap:1rem;height:9rem;margin:.8rem 0;align-items:flex-end}
.kbar{width:4.5rem;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.3rem}
.kbar i{display:block;width:100%;background:var(--kc);border-radius:.4rem .4rem 0 0;transition:height .6s}.kbar span{display:flex;align-items:center;gap:.3rem;font-weight:800;color:var(--kc)}.kbar span .ksh{width:1.1rem;fill:var(--kc)}
.kbins{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
.kbin{border:3px dashed var(--kc);border-radius:var(--r);padding:.6rem;min-height:6rem;cursor:pointer;background:color-mix(in srgb,var(--kc) 7%,var(--surface))}
.kbin>b{display:block;color:var(--kc);margin-bottom:.4rem}.kin{display:flex;flex-wrap:wrap;gap:.35rem}
.kitems{display:flex;flex-wrap:wrap;gap:.4rem;min-height:2.6rem}.dchip.sel{outline:3px solid var(--sun)}
.slot .sn{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--surface-2);margin-inline-end:.3rem;font-size:.8rem}
.korder{display:grid;gap:.4rem;padding-inline-start:1.5rem;font-weight:700;font-size:1.1rem}
.kpairs{display:grid;gap:.4rem}.kpairs>div{display:flex;gap:.6rem;align-items:center;padding:.5rem .8rem;border-radius:.7rem;border-inline-start:.4rem solid var(--kc);background:var(--surface-2)}
.khost,.kplay{display:flex;flex-direction:column;gap:.8rem;min-height:70vh;background:var(--bg)}
.khost:fullscreen{padding:1.2rem;overflow:auto}
.kbar-top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem .8rem;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kbody{position:relative}
.klobby{display:grid;gap:1rem;justify-items:center}
.kjoin{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1.2rem;padding:1.2rem 1.6rem;border-radius:var(--r);background:linear-gradient(135deg,#46178F,#7B2CBF);color:#fff;width:100%}
.kjoin>div:first-child{display:grid;gap:.2rem;text-align:center}.kjoin .muted{color:rgba(255,255,255,.8)}.kurl{font-size:1.1rem}
.kpin{font-family:var(--f-display);font-size:clamp(3rem,2rem + 5vw,6rem);font-weight:800;letter-spacing:.15em;background:#fff;color:#46178F;border-radius:var(--r);padding:.1rem 1.4rem;direction:ltr;line-height:1.2}
.kqr{background:#fff;padding:.5rem;border-radius:.6rem}.kqr img,.kqr canvas{display:block}
.kplayers{justify-content:center;max-width:60rem}.kplayers .pchip{font-size:1.1rem;padding:.45rem 1rem}
.kq-host{display:grid;gap:.9rem;position:relative}
.kbigq{font-size:clamp(1.3rem,1rem + 1.6vw,2.3rem);text-align:center;margin:.3rem 0;line-height:1.5}
.kmid{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center}
@media (max-width:48rem){.kmid{grid-template-columns:1fr 1fr}.kmid .kstagebox{grid-column:1/-1;grid-row:1}}
.ktimer{width:5.5rem;height:5.5rem;border-radius:50%;background:#46178F;color:#fff;display:grid;place-items:center;font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.ktimer.low{background:var(--bad);animation:pdot 1s infinite}
.kansbox{display:grid;justify-items:center}.kansbox b{font-size:2rem;font-variant-numeric:tabular-nums}
.kstagebox{min-width:0}.kshow{justify-content:center}.kh .fig{--fig-h:clamp(14rem,40vh,26rem)}
.kready{position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:.4rem;background:color-mix(in srgb,var(--bg) 97%,transparent);border-radius:var(--r);font-size:2rem;font-weight:800}
.kready b{font-size:5rem;color:#46178F;animation:popIn .5s ease infinite alternate}.kready[hidden]{display:none}
.kboard li{animation:popIn .4s ease both;font-size:1.15rem}.kplus{color:var(--ok);font-weight:800}.kstreak{color:#E8590C;font-weight:800}.kstreak.big{font-size:1.1rem}
.kpod{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:.6rem;max-width:42rem;margin:1rem auto 0;min-height:18rem}
.kp{display:grid;justify-items:center;gap:.3rem;animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both}
.kp1{animation-delay:1.6s}.kp2{animation-delay:.8s}.kp3{animation-delay:.1s}
.kpn{font-size:1.2rem;text-align:center;overflow-wrap:anywhere}.kps{font-weight:800;color:var(--muted)}
.kpb{width:100%;display:grid;place-items:center;color:#fff;font-size:2.4rem;font-weight:800;border-radius:.6rem .6rem 0 0}
.kp1 .kpb{height:11rem;background:#E2B33C}.kp2 .kpb{height:8rem;background:#9AA5B1}.kp3 .kpb{height:5.5rem;background:#C98A55}
@keyframes rise{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-2rem;left:var(--x);width:.6rem;height:1rem;background:var(--c);border-radius:.15rem;animation:fall var(--d) linear var(--l) 2 both}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
html.calm .confetti,html.calm .kp,html.calm .kboard li{animation:none}
.kfb{display:grid;justify-items:center;text-align:center;gap:.6rem;padding:2rem 1.2rem;border-radius:var(--r);color:#fff;min-height:45vh;align-content:center}
.kfb.ok{background:linear-gradient(160deg,#26890C,#1C6B08)}.kfb.no{background:linear-gradient(160deg,#C0233A,#8E1627)}.kfb.wait{background:linear-gradient(160deg,#46178F,#2E0F5F)}
.kfb h2{color:#fff;font-size:1.8rem}.kfb .pill{color:var(--ink)}.kfb .pulse-dot{background:#fff}
.kpts{font-size:3rem;font-weight:800;font-family:var(--f-display)}.kname{font-size:2rem;font-weight:800;background:rgba(255,255,255,.15);padding:.3rem 1.2rem;border-radius:.8rem}
.btn.kstop{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}.kaskbox{margin:.2rem 0}
.kfb .muted{color:rgba(255,255,255,.85)}
.kright{background:rgba(255,255,255,.14);padding:.5rem .9rem;border-radius:.7rem}
.kq-play{position:relative}.ktext{font-size:clamp(1.1rem,1rem + .6vw,1.5rem)}
.kdone{opacity:.5;pointer-events:none}
.kcreate{background:linear-gradient(160deg,color-mix(in srgb,#7B2CBF 10%,var(--surface)),var(--surface))}

.dn3d{position:relative;overflow:hidden;background:#050b1a}
.dn3d canvas{display:block;width:100%;height:100%}
.tag3d.bh{background:#FF3B30;color:#fff;border-color:#fff}

.dn-side.day{right:.6rem;color:#FFE38A}.dn-side.night{left:.6rem;color:#C3D0FF}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   مختبر العلوم الصغير — تصميم وإعداد: الأستاذة مها الخزاعي
   البنية: محتوى الدروس (LES) ← خدمات (DataService / ProgressService) ← واجهات.
   للتحويل إلى نسخة أونلاين: استبدل LocalAdapter بمحوّل API بالدوال نفسها.
   نماذج البيانات المستقبلية: User{id,role,name,grade} Class{id,teacherId,code,studentIds[]}
   Quiz{id,teacherId,lessonIds[],count,levels,startsAt} Attempt{id,quizId,userId,answers[],score,byObjective{}}
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const isDark=()=>{const t=document.documentElement.dataset.theme;if(t)return t==='dark';return matchMedia('(prefers-color-scheme: dark)').matches};

/* ---------- التخزين ---------- */
const LocalAdapter={
  get(k,d){try{const v=localStorage.getItem('mls_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('mls_'+k,JSON.stringify(v))}catch(e){}}
};
const memo={};
const store={get:(k,d)=>k in memo?memo[k]:(memo[k]=LocalAdapter.get(k,d)),set:(k,v)=>{memo[k]=v;LocalAdapter.set(k,v)}};
const ProgressService={
  getPoints:()=>store.get('points',0),
  addPoints(n){const p=this.getPoints()+n;store.set('points',p);const e=$('#pts');if(e)e.textContent=p;return p},
  saveResult(id,res){const all=store.get('results',{});(all[id]=all[id]||[]).push(res);if(all[id].length>20)all[id].shift();store.set('results',all)},
  best(id){const r=(store.get('results',{})[id]||[]);return r.length?Math.max(...r.map(x=>x.pct)):null},
  badges:()=>store.get('badges',[]),
  award(b){const s=new Set(this.badges());if(!s.has(b)){s.add(b);store.set('badges',[...s]);toast('حصلت على شارة: '+b)}}
};

/* ---------- إعدادات الطالب ---------- */
const FONTS={plex:['IBM Plex Sans Arabic','واضح وحديث'],tajawal:['Tajawal','بسيط ومريح'],cairo:['Cairo','عريض وواضح'],almarai:['Almarai','دائري وسهل'],naskh:['Noto Naskh Arabic','نسخ تقليدي كخط الكتب'],kufi:['Noto Kufi Arabic','كوفي حديث']};
const Settings={d:{scale:1,font:'plex',head:'kufi',theme:'auto',rate:.9,autoRead:true,calm:false,hc:false,spacing:false,qcount:8,name:'',tashkeel:false},
  get(k){return store.get('set',{})[k]??this.d[k]},set(k,v){const s=store.get('set',{});s[k]=v;store.set('set',s);this.apply()},
  reset(){store.set('set',{});this.apply()},
  apply(){const r=document.documentElement;r.style.setProperty('--fscale',this.get('scale'));
    const f=FONTS[this.get('font')]||FONTS.plex,h=FONTS[this.get('head')]||FONTS.kufi;r.style.setProperty('--f-body',`"${f[0]}",Tahoma,sans-serif`);r.style.setProperty('--f-display',`"${h[0]}","${f[0]}",Tahoma,sans-serif`);
    const t=this.get('theme');if(t==='auto')delete r.dataset.theme;else r.dataset.theme=t;
    r.classList.toggle('calm',!!this.get('calm'));r.classList.toggle('hc',!!this.get('hc'));r.classList.toggle('wide-gap',!!this.get('spacing'));try{VOC.show(this.get('tashkeel'))}catch(e){}}};
Settings.apply();

/* ---------- المؤثرات الصوتية ---------- */
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
const Sound={
  on:store.get('sound',true),ctx:null,unlocked:false,
  unlock(){
    try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}
    if(this.unlocked)return;this.unlocked=true;
    try{const a=new Audio(SILENT);a.setAttribute('playsinline','');const p=a.play();p&&p.catch(()=>{})}catch(e){}
  },
  tone(fs,d=.12,type='sine',g=.18){if(!this.on)return;this.unlock();const c=this.ctx;if(!c)return;
    try{fs.forEach((f,i)=>{const o=c.createOscillator(),v=c.createGain(),t=c.currentTime+i*d;o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.015);v.gain.exponentialRampToValueAtTime(.0001,t+d*1.8);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d*1.9)})}catch(e){}},
  ok(){this.tone([523,659,784],.1,'triangle',.22)},bad(){this.tone([233,175],.17,'square',.07)},tap(){this.tone([880],.05,'sine',.12)},
  win(){this.tone([523,659,784,1046],.12,'triangle',.22)},whoosh(){this.tone([300,450,650,900],.06,'sine',.12)},
  say(t){if(this.on&&Settings.get('autoRead'))TTS.speak(t,null,true)}
};
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>Sound.unlock(),{passive:true}));

/* ---------- النطق العربي ---------- */
const TTS={
  ok:'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',voices:[],btn:null,started:false,warned:false,
  init(){if(!this.ok)return;const L=()=>{try{this.voices=speechSynthesis.getVoices()||[]}catch(e){}};L();try{speechSynthesis.addEventListener('voiceschanged',L)}catch(e){try{speechSynthesis.onvoiceschanged=L}catch(_){}}},
  voice(){return this.voices.find(v=>/^ar([-_]|$)/i.test(v.lang))||null},
  stop(){if(this.ok){try{speechSynthesis.cancel()}catch(e){}}if(this.btn)this.btn.classList.remove('speaking');this.btn=null},
  speak(text,btn,quiet){
    if(!this.ok){if(!quiet)toast('النطق الصوتي غير مدعوم في هذا العارض. افتح الرابط في متصفح Chrome أو Safari.');return}
    if(btn&&this.btn===btn){this.stop();return}
    const busy=speechSynthesis.speaking||speechSynthesis.pending;this.stop();
    const v=this.voice();
    if(!v&&this.voices.length&&!this.warned&&!quiet){this.warned=true;toast('لا يوجد صوت عربي مثبّت على جهازك، لذلك قد يُقرأ النص بصوت آخر. يمكن إضافة الصوت العربي من إعدادات الجهاز.')}
    const parts=(String((()=>{try{return VOC.speech(text)}catch(e){return text}})()).match(/[^.؟!\n]+[.؟!]?/g)||[text]).map(s=>s.trim()).filter(Boolean);
    this.started=false;
    const run=()=>{this.btn=btn;btn&&btn.classList.add('speaking');
      parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang=v?v.lang:'ar-SA';if(v)u.voice=v;u.rate=Settings.get('rate');u.pitch=1.05;u.volume=1;
        u.onstart=()=>{this.started=true};if(i===parts.length-1){u.onend=()=>{if(this.btn===btn)this.stop()};u.onerror=()=>{if(this.btn===btn)this.stop()}}
        try{speechSynthesis.speak(u)}catch(e){}});
      try{speechSynthesis.resume()}catch(e){}
      if(!quiet)setTimeout(()=>{if(!this.started&&this.btn===btn){this.stop();toast('لم يصدر الصوت. تأكد من رفع مستوى الصوت وإلغاء الوضع الصامت، أو افتح الرابط في متصفح Chrome أو Safari.')}},2600)};
    busy?setTimeout(run,140):run();
  }
};
TTS.init();
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const speakBtn=t=>`<button class="iconbtn" data-say="${esc(t)}" aria-label="استمع إلى النص">${SPK}</button>`;
function paintSound(){const b=$('#soundBtn');b.setAttribute('aria-pressed',Sound.on);
  b.innerHTML=(Sound.on?SPK:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>')+`<span>${Sound.on?'الصوت يعمل':'الصوت مكتوم'}</span>`;
  b.setAttribute('aria-label',Sound.on?'كتم المؤثرات الصوتية':'تشغيل المؤثرات الصوتية')}
let toastT=null;
function toast(t){$$('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),t.length>60?5200:2600)}
const star=(on=true)=>`<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z" fill="${on?'#F2B233':'var(--line)'}"/></svg>`;

/* ---------- المنهج (من الفهرس المرفق) ---------- */
const C=(n,title,lessons,extra={})=>({n,title,lessons:lessons.map(x=>Array.isArray(x)?{t:x[0],p:x[1]}:{t:x}),...extra});
const CURRICULUM=[
 {grade:1,name:'الصف الأول',areas:'المخلوقات الحية والنباتات والحيوانات والمادة والطقس والحركة والطاقة',parts:[
  {part:1,src:'موضوعات مجمّعة من مصادر تعليمية منشورة',verify:'يلزم مطابقة ترتيب الموضوعات مع نسخة الكتاب المستخدمة في المدرسة.',chapters:[
   C(null,'النباتات مخلوقات حية',['المخلوقات الحية','النباتات وأجزاؤها']),

// مسرح لوحة رسم (canvas) يتكيّف مع حجم الحاوية وكثافة الشاشة
function canvasStage(host,{frame,down,move,up,cls='',ar}={}){
  const fig=document.createElement('div');fig.className='fig drag '+cls;if(ar){fig.style.setProperty('--ar',ar);fig.dataset.ar='1'}host.appendChild(fig);
  const cv=document.createElement('canvas');fig.appendChild(cv);const ctx=cv.getContext('2d');
  const S={fig,cv,ctx,w:1,h:1,t:0,dt:0,dark:isDark()};
  const fit=()=>{const r=fig.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);S.w=Math.max(1,r.width);S.h=Math.max(1,r.height);cv.width=Math.round(S.w*d);cv.height=Math.round(S.h*d);ctx.setTransform(d,0,0,d,0,0);S.dark=isDark()};
  const ro=new ResizeObserver(fit);ro.observe(fig);fit();
  let raf,last=0;const loop=t=>{raf=requestAnimationFrame(loop);S.dt=Math.min(.05,(t-last)/1000||0);last=t;S.t=t/1000;frame&&frame(S)};raf=requestAnimationFrame(loop);
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  let isDown=false;
  cv.addEventListener('pointerdown',e=>{isDown=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}down&&down(pos(e),S,e)});
  cv.addEventListener('pointermove',e=>{move&&move(pos(e),S,e,isDown)});
  const end=e=>{if(!isDown)return;isDown=false;up&&up(pos(e),S,e)};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  S.stop=()=>{cancelAnimationFrame(raf);ro.disconnect()};
  return S;
}

// نسبة الرسم تُقرأ من viewBox تلقائياً لكل مساحة رسم جديدة
function fitAR(f){if(f.dataset.ar)return;const s=f.querySelector(':scope>svg');if(!s)return;const v=(s.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);if(v.length===4&&v[2]&&v[3]){f.style.setProperty('--ar',v[2]+'/'+v[3]);f.dataset.ar='1'}}
new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.classList&&n.classList.contains('fig'))fitAR(n);if(n.parentElement&&n.parentElement.classList.contains('fig'))fitAR(n.parentElement);n.querySelectorAll&&n.querySelectorAll('.fig').forEach(fitAR)})}).observe(document.documentElement,{childList:true,subtree:true});

function tabsWidget(host,tabs){
  const top=document.createElement('div');top.style.marginBottom='.6rem';host.appendChild(top);
  const box=document.createElement('div');host.appendChild(box);let clean=null;
  const open=k=>{clean&&clean();clean=null;box.innerHTML='';const t=tabs.find(x=>x[0]===k);const r=t[2](box);if(typeof r==='function')clean=r};
  top.appendChild(seg(tabs.map(t=>[t[0],t[1]]),tabs[0][0],open));open(tabs[0][0]);
  return ()=>clean&&clean();
}

/* مجسم النبتة ثلاثي الأبعاد */
function mountPlant3D(host,onPick){
  const NO={ok:false,dispose(){},explode(){},labels(){},highlight(){}};
  if(!window.THREE){host.innerHTML='<p class="fallback">تعذّر تحميل العرض ثلاثي الأبعاد على هذا الجهاز.</p>';return NO}
  const T=THREE,scene=new T.Scene(),cam=new T.PerspectiveCamera(36,1,.1,100);
  let r;try{r=new T.WebGLRenderer({antialias:true,alpha:true})}catch(e){host.innerHTML='<p class="fallback">جهازك لا يدعم العرض ثلاثي الأبعاد.</p>';return NO}
  r.setPixelRatio(Math.min(devicePixelRatio||1,2));host.appendChild(r.domElement);
  scene.add(new T.HemisphereLight(0xffffff,0x7a5233,.9));const dl=new T.DirectionalLight(0xffffff,.85);dl.position.set(3,7,6);scene.add(dl);const bl=new T.DirectionalLight(0xbfe3ff,.35);bl.position.set(-4,2,-5);scene.add(bl);
  const root=new T.Group();scene.add(root);const parts={};
  const mk=(key,mat)=>{const g=new T.Group();g.userData.part=key;root.add(g);parts[key]={g,mats:[mat],subs:[]};return g};
  const std=(c,o={})=>new T.MeshStandardMaterial({color:c,roughness:.6,metalness:0,...o});
  // كتلة التربة (مقطع شفاف تظهر فيه الجذور)
  const soilM=std(0x9a6b44,{transparent:true,opacity:.28,depthWrite:false});const soil=new T.Mesh(new T.BoxGeometry(3.6,2.2,3.6),soilM);soil.position.y=-1.1;root.add(soil);
  const edge=new T.LineSegments(new T.EdgesGeometry(soil.geometry),new T.LineBasicMaterial({color:0x7a5233,transparent:true,opacity:.6}));edge.position.copy(soil.position);root.add(edge);
  const grass=new T.Mesh(new T.BoxGeometry(3.6,.06,3.6),std(0x6cbf4f));grass.position.y=.02;root.add(grass);
  // الجذور (أنابيب منحنية)
  const rm=std(0xb88a5a);const roots=mk('roots',rm);const tube=(pts,rad)=>{const m=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts.map(p=>new T.Vector3(...p))),24,rad,8,false),rm);m.userData.part='roots';roots.add(m)};
  tube([[0,0,0],[.03,-.5,.02],[-.04,-1.1,.05],[.02,-1.7,-.03],[0,-2.05,0]],.07);
  for(let i=0;i<9;i++){const a=i/9*Math.PI*2,y=-.15-(i%3)*.45,L=.6+(i%4)*.18;tube([[0,y,0],[Math.cos(a)*L*.4,y-.18,Math.sin(a)*L*.4],[Math.cos(a)*L*.8,y-.45,Math.sin(a)*L*.8],[Math.cos(a+.3)*L,y-.8,Math.sin(a+.3)*L]],.028)}
  // الساق
  const sm=std(0x4fa54f);const stem=mk('stem',sm);const sMesh=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([[0,0,0],[.04,1,0],[-.03,2,.02],[0,3,0]].map(p=>new T.Vector3(...p))),30,.09,12,false),sm);sMesh.userData.part='stem';stem.add(sMesh);
  // الأوراق (أشكال ورقة حقيقية)
  const lm=std(0x4cb860,{side:T.DoubleSide});const leaves=mk('leaves',lm);const vm=new T.MeshBasicMaterial({color:0xdff5df,side:T.DoubleSide});
  const ls=new T.Shape();ls.moveTo(0,0);ls.bezierCurveTo(.3,.34,.85,.36,1.25,0);ls.bezierCurveTo(.85,-.36,.3,-.34,0,0);const lg=new T.ShapeGeometry(ls,20);
  [[.85,0],[1.35,2.5],[1.85,1.1],[2.35,4.0]].forEach(([y,a])=>{const g=new T.Group();g.position.y=y;g.rotation.y=a;g.userData.part='leaves';
    const pet=new T.Mesh(new T.CylinderGeometry(.02,.025,.3,6),sm);pet.rotation.z=-Math.PI/2+.4;pet.position.set(.13,.06,0);pet.userData.part='leaves';g.add(pet);
    const leaf=new T.Mesh(lg,lm);leaf.rotation.x=-Math.PI/2+.25;leaf.position.set(.26,.12,0);leaf.rotation.z=.2;leaf.userData.part='leaves';g.add(leaf);
    const vein=new T.Mesh(new T.PlaneGeometry(1.1,.025),vm);vein.rotation.copy(leaf.rotation);vein.position.set(.26+.55*Math.cos(.2),.12+.55*Math.sin(.2)*.97+.005,0);vein.userData.part='leaves';g.add(vein);
    leaves.add(g);parts.leaves.subs.push({g,dir:new T.Vector3(Math.cos(-a),0,Math.sin(-a))})});

  const pm=std(0xf06d93,{side:T.DoubleSide});const flower=mk('flower',pm);flower.position.y=3.02;parts.flower.home=3.02;
  const ps=new T.Shape();ps.moveTo(0,0);ps.bezierCurveTo(.12,.2,.42,.22,.55,0);ps.bezierCurveTo(.42,-.22,.12,-.2,0,0);const pg=new T.ShapeGeometry(ps,16);
  for(let i=0;i<9;i++){const a=i/9*Math.PI*2,h=new T.Group();h.rotation.y=a;const p=new T.Mesh(pg,pm);p.rotation.x=-Math.PI/2;p.rotation.y=-.45;p.position.x=.08;p.userData.part='flower';h.add(p);h.userData.part='flower';flower.add(h)}
  const cm=std(0xf6c23b);const ctr=new T.Mesh(new T.SphereGeometry(.17,20,14),cm);ctr.scale.y=.6;ctr.position.y=.06;ctr.userData.part='flower';flower.add(ctr);parts.flower.mats.push(cm);
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2,s=new T.Mesh(new T.ConeGeometry(.06,.26,6),sm);s.position.set(Math.cos(a)*.13,-.1,Math.sin(a)*.13);s.rotation.z=Math.cos(a)*1.1;s.rotation.x=-Math.sin(a)*1.1;s.userData.part='flower';flower.add(s)}
  const anchors={roots:[roots,new T.Vector3(.9,-1.2,0)],stem:[stem,new T.Vector3(.12,1.6,0)],leaves:[parts.leaves.subs[1].g,new T.Vector3(1.4,.3,0)],flower:[flower,new T.Vector3(0,.4,0)]};
  const tags={};Object.keys(anchors).forEach(k=>{const d=document.createElement('div');d.className='tag3d off';d.textContent=PLANT_PARTS[k][0];host.appendChild(d);tags[k]=d});
  let showL=false,exT=0,exV=0,rotY=.5,rotX=.12,auto=true,raf,sel=null,down=null,moved=0;
  const size=()=>{const w=host.clientWidth,h=host.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;const z=w/h<.85?13.5:w/h<1.2?11.5:10.2;cam.position.set(0,.9,z);cam.lookAt(0,.6,0);cam.updateProjectionMatrix()};
  const ro=new ResizeObserver(size);ro.observe(host);size();
  const cv=r.domElement;cv.style.cursor='grab';
  cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};moved=0;auto=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;moved+=Math.abs(dx)+Math.abs(dy);rotY+=dx*.011;rotX=clamp(rotX+dy*.006,-.45,.6);down={x:e.clientX,y:e.clientY}});
  const ray=new T.Raycaster(),v2=new T.Vector2();
  cv.addEventListener('pointerup',e=>{if(down&&moved<8){const b=cv.getBoundingClientRect();v2.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);ray.setFromCamera(v2,cam);
    const hit=ray.intersectObjects(Object.values(parts).map(p=>p.g),true)[0];if(hit){let o=hit.object;while(o&&!o.userData.part)o=o.parent;if(o)onPick(o.userData.part)}}down=null});
  const tmp=new T.Vector3();
  const loop=()=>{raf=requestAnimationFrame(loop);if(auto)rotY+=.004;root.rotation.y+=(rotY-root.rotation.y)*.15;root.rotation.x+=(rotX-root.rotation.x)*.15;
    exV+=(exT-exV)*.08;roots.position.y=-1.1*exV;flower.position.y=parts.flower.home+1*exV;parts.leaves.subs.forEach(s=>{s.g.position.x=s.dir.x*.9*exV;s.g.position.z=s.dir.z*.9*exV});
    soilM.opacity=.28*(1-exV*.6);
    const t=performance.now()/260;Object.entries(parts).forEach(([k,p])=>p.mats.forEach(m=>{m.emissive.setHex(k===sel?0x3a3a10:0);m.emissiveIntensity=k===sel?.7+.3*Math.sin(t):0}));
    r.render(scene,cam);const w=host.clientWidth,h=host.clientHeight;
    Object.entries(anchors).forEach(([k,[o,a]])=>{tmp.copy(a);o.localToWorld(tmp);tmp.project(cam);const d=tags[k];d.style.left=((tmp.x+1)/2*w)+'px';d.style.top=((1-tmp.y)/2*h)+'px';d.classList.toggle('off',!(showL||k===sel))})};
  loop();
  return{ok:true,explode:v=>{exT=v?1:0;auto=false},labels:v=>{showL=v},highlight:k=>{sel=k},
    dispose:()=>{cancelAnimationFrame(raf);ro.disconnect();r.dispose();scene.traverse(o=>{o.geometry&&o.geometry.dispose()})}};
}

const GROW_STAGES=['البذرة','الإنبات','البادرة','النبات البالغ','الزهرة','الثمرة والبذور'];
function growthSVG(t){ // t من 0 إلى 100
  const st=t<15?0:t<30?1:t<45?2:t<68?3:t<82?4:5;const gx=200,gy=250;
  const rootLen=clamp((t-15)/30,0,1),stemH=t<30?0:t<45?lerp(10,55,(t-30)/15):t<68?lerp(55,150,(t-45)/23):150;
  let s=`${ART.sky(400,250)}${ART.sun(340,50,20)}<rect y="250" width="400" height="150" fill="url(#gSoil)"/><path d="M0 251 Q100 244 200 251 T400 251" stroke="#4E9F3D" stroke-width="5" fill="none"/>`;
  const seedOpen=t>=15;
  if(t<45)s+=`<g transform="translate(${gx} ${gy+40})"><ellipse rx="16" ry="11" fill="#B07A3E"/>${seedOpen?'<path d="M-14 -2 Q0 -14 14 -2" stroke="#7A5233" stroke-width="2" fill="none"/>':''}<ellipse rx="10" ry="5" cx="-3" cy="-3" fill="#D9A869" opacity=".7"/></g>`;
  if(rootLen>0){const L=rootLen*90;s+=`<path d="M${gx} ${gy+44} Q${gx-4} ${gy+44+L*.5} ${gx+2} ${gy+44+L}" stroke="url(#gRoot)" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    if(rootLen>.4)s+=`<path d="M${gx} ${gy+60} q-20 14 -30 ${30*rootLen} M${gx} ${gy+70} q22 12 30 ${32*rootLen}" stroke="url(#gRoot)" stroke-width="2.5" fill="none"/>`}
  if(stemH>0){const top=gy-stemH;s+=`<path d="M${gx} ${gy+40} Q${gx+3} ${gy} ${gx} ${top}" stroke="url(#gStem)" stroke-width="${t<45?5:8}" fill="none" stroke-linecap="round"/>`;
    if(t<45)s+=`<path d="M${gx} ${top} C${gx-8} ${top-14} ${gx-26} ${top-12} ${gx-30} ${top-2} C${gx-20} ${top+6} ${gx-6} ${top+4} ${gx} ${top}Z" fill="url(#gLeaf)"/><path d="M${gx} ${top} C${gx+8} ${top-14} ${gx+26} ${top-12} ${gx+30} ${top-2} C${gx+20} ${top+6} ${gx+6} ${top+4} ${gx} ${top}Z" fill="url(#gLeaf2)"/>`;
    else{const n=Math.round(clamp((stemH-55)/95,0,1)*4)+1;for(let i=0;i<n;i++){const y=gy-30-i*28,d=i%2?1:-1;s+=`<path d="M${gx} ${y} C${gx+d*18} ${y-20} ${gx+d*48} ${y-18} ${gx+d*60} ${y-4} C${gx+d*44} ${y+12} ${gx+d*16} ${y+8} ${gx} ${y}Z" fill="url(#gLeaf${d>0?2:''})"/>`}}
    if(t>=68&&t<82){const k=(t-68)/14;[[0,top-6],[-34,top+34],[34,top+52]].forEach(([dx,y])=>{s+=`<g transform="translate(${gx+dx} ${y}) scale(${.4+k*.6})">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(${a})" fill="#FFD54D"/>`).join('')}<circle r="4" fill="#E08E0B"/></g>`})}
    if(t>=82){const k=clamp((t-82)/10,0,1),fall=clamp((t-92)/8,0,1);[[0,top-2],[-34,top+38],[34,top+56]].forEach(([dx,y],i)=>{s+=`<circle cx="${gx+dx}" cy="${y+fall*(i===1?(gy+20-y):0)}" r="${6+k*9}" fill="${k<.5?'#7CC243':'#E5432D'}"/><path d="M${gx+dx-4} ${y-12-k*4} l4 4 l4 -4" stroke="#3F9A4A" stroke-width="2" fill="none"/>`});
      if(fall>.5)s+=[[-60,262],[-46,270],[-30,264]].map(([dx,y])=>`<ellipse cx="${gx+dx}" cy="${y}" rx="4" ry="3" fill="#B07A3E"/>`).join('')}}
  return {svg:s,st};
}

/* ---------- 4. دورات حياة الحيوانات ---------- */
const BF=['البيضة','اليرقة','العذراء','الفراشة البالغة'],FR=['البيضة','الشرغوف','الضفدع الصغير','الضفدع البالغ'];
const stageArt={bf:[s=>ART.eggsLeaf(0,0,s),s=>ART.caterpillar(0,0,s),s=>ART.chrysalis(0,0,s),s=>ART.butterfly(0,0,s)],fr:[s=>ART.frogEggs(0,0,s),s=>ART.tadpole(0,0,s),s=>G(0,0,s,ART.frog(0,0,.8,.7)),s=>ART.frog(0,0,s)]};
function cycleSVG(kind,cur,names){
  const cx=300,cy=200,R=140,n=4;let s=`<rect width="600" height="400" fill="${kind==='fr'?'#DDF0F7':'#EEF7E8'}"/>${kind==='fr'?'<rect y="330" width="600" height="70" fill="url(#gWater)" opacity=".5"/>':''}`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#9BB4A9" stroke-width="3" stroke-dasharray="8 10"/>`;
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,a2=a+2*Math.PI/n,am=(a+a2)/2;
    s+=`<path d="M${cx+Math.cos(am-.18)*R} ${cy+Math.sin(am-.18)*R} A${R} ${R} 0 0 1 ${cx+Math.cos(am+.18)*R} ${cy+Math.sin(am+.18)*R}" stroke="#0F6F78" stroke-width="5" fill="none" marker-end="url(#arwG)"/>`;
    const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R,on=i===cur;
    s+=`<g data-hot="${i}" style="cursor:pointer" tabindex="0" role="button"><circle cx="${x}" cy="${y}" r="46" fill="#fff" stroke="${on?'#F2B233':'#CFE0D7'}" stroke-width="${on?6:3}" filter="url(#fShadow)"/>${G(x,y,.42,stageArt[kind][i](1))}
      <rect x="${x-50}" y="${y+50}" width="100" height="26" rx="13" fill="${on?'#0F6F78':'#fff'}" stroke="#CFE0D7"/><text x="${x}" y="${y+68}" text-anchor="middle" font-size="14" font-weight="700" fill="${on?'#fff':'#16302A'}">${names[i]}</text></g>`}
  s+=`<g transform="translate(${cx} ${cy})"><circle r="70" fill="#fff" opacity=".85"/>${G(0,4,.82,stageArt[kind][cur](1))}</g>`;
  return `<svg viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet" role="img">${s}</svg>`;
}

/* ---------- 5. السلاسل والشبكات الغذائية ---------- */
const FW={sun:['الشمس',90,70],grass:['العشب',140,300],gh:['الجرادة',300,300],rabbit:['الأرنب',300,195],bird:['العصفور',450,250],hawk:['الصقر',510,90],fungi:['الفطريات',560,320]};
const FW_EDGES=[['sun','grass'],['grass','gh'],['grass','rabbit'],['gh','bird'],['bird','hawk'],['rabbit','hawk']];
function foodSVG(){const art={sun:ART.sun(0,0,26),grass:`<g>${[-30,-15,0,15,30].map(x=>`<path d="M${x} 20 Q${x-6} -10 ${x+2} -26 Q${x+4} -6 ${x+8} 20Z" fill="url(#gLeaf)"/>`).join('')}</g>`,gh:ART.grasshopper(0,0,.75),rabbit:ART.rabbit(0,0,.9),bird:ART.bird(0,0,.9),hawk:ART.hawk(0,0,.62),fungi:`<g>${ART.mushroom(-10,18,.8)}${ART.mushroom(16,20,.55)}${ART.bacteria(0,-24,.8)}</g>`};
  return `<svg viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet">${ART.sky(640,380)}<rect y="320" width="640" height="60" fill="url(#gGround)"/><g id="edges"></g>
   ${Object.entries(FW).map(([k,[n,x,y]])=>`<g data-hot="${k}" class="fwn" style="cursor:pointer" tabindex="0" role="button"><circle cx="${x}" cy="${y}" r="44" fill="#fff" opacity=".85" stroke="#CFE0D7" stroke-width="3" class="halo"/>${G(x,y,1,art[k])}<rect x="${x-40}" y="${y+40}" width="80" height="24" rx="12" fill="#fff" stroke="#CFE0D7"/><text x="${x}" y="${y+57}" text-anchor="middle" font-size="14" font-weight="700" fill="#16302A">${n}</text></g>`).join('')}</svg>`}
function edge(a,b,cls='',col='#0F6F78'){const[,x1,y1]=FW[a],[,x2,y2]=FW[b];const d=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/d,uy=(y2-y1)/d;return `<line x1="${x1+ux*48}" y1="${y1+uy*48}" x2="${x2-ux*52}" y2="${y2-uy*52}" stroke="${col}" stroke-width="5" marker-end="url(#arwG)" class="${cls}" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur=".8s" repeatCount="indefinite"/></line>`}

function beforeAfter(box,before,after,onMove){
  const id='ba'+Math.random().toString(36).slice(2,7);
  const fig=svgStage(box,`<svg viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet" style="touch-action:none"><defs><clipPath id="${id}"><rect id="${id}r" x="0" y="0" width="320" height="380"/></clipPath></defs>
   <g>${after}</g><g clip-path="url(#${id})">${before}</g>
   <g id="${id}h" style="cursor:ew-resize"><line x1="320" y1="0" x2="320" y2="380" stroke="#fff" stroke-width="4"/><circle cx="320" cy="190" r="22" fill="#fff" filter="url(#fShadow)"/><path d="M308 190 l8 -8 v16z M332 190 l-8 -8 v16z" fill="#0F6F78"/></g>
   <rect x="12" y="12" width="64" height="30" rx="15" fill="#fff" opacity=".92"/><text x="44" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#16302A">قبل</text>
   <rect x="564" y="12" width="64" height="30" rx="15" fill="#fff" opacity=".92"/><text x="596" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#16302A">بعد</text></svg>`,'drag');
  const svg=$('svg',fig),R=$('#'+id+'r',fig),H=$('#'+id+'h',fig);let dn=false;
  const set=x=>{x=clamp(x,0,640);R.setAttribute('width',x);H.setAttribute('transform',`translate(${x-320} 0)`);onMove&&onMove(x/640)};
  const toX=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse()).x};
  svg.addEventListener('pointerdown',e=>{dn=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}set(toX(e))});
  svg.addEventListener('pointermove',e=>{if(dn)set(toX(e))});['pointerup','pointercancel'].forEach(v=>svg.addEventListener(v,()=>dn=false));
  return {fig,set};
}

const LAND=[[.2,.35,.22,.16],[1.2,-.1,.3,.25],[2.4,.3,.2,.3],[3.4,-.35,.35,.18],[4.6,.1,.28,.22],[5.5,-.2,.18,.25]];
function drawEarth(ctx,x,y,r,rot,dark,litFromLeft=true){
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#5FB4F0');g.addColorStop(1,'#1F5FA8');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();
  LAND.forEach(([lon,lat,w,h])=>{const a=lon+rot,c=Math.cos(a);if(c<-.1)return;ctx.fillStyle='#5DAE4B';ctx.beginPath();ctx.ellipse(x+Math.sin(a)*r*.9,y+lat*r,Math.max(2,w*r*Math.max(.15,c)),h*r,0,0,7);ctx.fill()});
  if(dark){ctx.fillStyle='rgba(5,12,30,.62)';ctx.fillRect(litFromLeft?x:x-r,y-r,r,2*r)}ctx.restore();
}
function moonPhase(ctx,x,y,r,a){ // a: الزاوية بين القمر والشمس كما تُرى من الأرض (0 = محاق)
  ctx.fillStyle='#2A2E36';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();const k=Math.cos(a),wax=Math.sin(a)>=0;
  ctx.fillStyle='#F1EEDF';ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,Math.PI/2,!wax);ctx.closePath();ctx.fill();
  ctx.fillStyle=k>0?'#2A2E36':'#F1EEDF';ctx.beginPath();ctx.ellipse(x,y,Math.abs(k)*r,r,0,0,7);ctx.fill();
}

const PLANETS=[['عطارد',.38,'#B5ADA3','داخلي صخري','أقرب الكواكب إلى الشمس.'],['الزهرة',.95,'#E8C48A','داخلي صخري','الكوكب الثاني من الشمس.'],['الأرض',1,'#3C8DD8','داخلي صخري','الكوكب الوحيد المعروف بوجود الحياة عليه.'],['المريخ',.53,'#C8553D','داخلي صخري','الكوكب الرابع، لونه يميل إلى الأحمر.'],['المشتري',3.2,'#D9B48A','خارجي غازي','أكبر الكواكب.'],['زحل',2.7,'#E6CF94','خارجي غازي','له حلقات واضحة جميلة.'],['أورانوس',1.8,'#9ED8E0','خارجي غازي','كوكب غازي بارد بعيد.'],['نبتون',1.75,'#4B6FD6','خارجي غازي','أبعد الكواكب عن الشمس.']];
function planetsFlat(){return `<svg viewBox="0 0 700 260" preserveAspectRatio="xMidYMid meet"><rect width="700" height="260" fill="#0E1B33"/>${Array.from({length:40},(_,i)=>`<circle cx="${(i*97)%700}" cy="${(i*53)%260}" r="1.2" fill="#fff" opacity=".6"/>`).join('')}<circle cx="-40" cy="130" r="110" fill="url(#gSun)"/>
  ${PLANETS.map(([n,s,c],i)=>{const x=110+i*76,r=Math.max(6,s*9);return `${i===5?`<ellipse cx="${x}" cy="130" rx="${r*1.9}" ry="${r*.5}" fill="none" stroke="#E6CF94" stroke-width="3"/>`:''}<circle cx="${x}" cy="130" r="${r}" fill="${c}"/><circle cx="${x-r*.3}" cy="${130-r*.3}" r="${r*.35}" fill="#fff" opacity=".2"/><text x="${x}" y="${150+r+8}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${n}</text>`}).join('')}</svg>`}
function planetTex(color,bands,ring){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,256,128);
  if(bands){for(let i=0;i<12;i++){x.fillStyle=`rgba(${i%2?255:80},${i%2?240:60},${i%2?220:40},.18)`;x.fillRect(0,i*11+Math.sin(i)*3,256,6+i%3*3)}}else{for(let i=0;i<40;i++){x.fillStyle='rgba(0,0,0,.12)';x.beginPath();x.arc(Math.random()*256,Math.random()*128,2+Math.random()*10,0,7);x.fill()}}
  const t=new THREE.CanvasTexture(c);return t}
function mountSolar3D(host,onPick){
  const NO={ok:false,dispose(){},labels(){},speed(){}};if(!window.THREE){host.innerHTML='<p class="fallback">تعذّر تحميل العرض ثلاثي الأبعاد.</p>';return NO}
  const T=THREE,scene=new T.Scene(),cam=new T.PerspectiveCamera(45,1,.1,500);let r;try{r=new T.WebGLRenderer({antialias:true,alpha:true})}catch(e){host.innerHTML='<p class="fallback">جهازك لا يدعم العرض ثلاثي الأبعاد.</p>';return NO}
  r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setClearColor(0x0a1428,1);host.appendChild(r.domElement);
  const sg=new T.BufferGeometry(),pos=[];for(let i=0;i<600;i++){const v=new T.Vector3().randomDirection?new T.Vector3().randomDirection():new T.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();pos.push(v.x*150,v.y*150,v.z*150)}sg.setAttribute('position',new T.Float32BufferAttribute(pos,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:.6})));
  scene.add(new T.AmbientLight(0xffffff,.25));const pl=new T.PointLight(0xfff2cc,1.6,0);scene.add(pl);
  const sun=new T.Mesh(new T.SphereGeometry(3.2,40,30),new T.MeshBasicMaterial({color:0xffcc33}));sun.userData.i=-1;scene.add(sun);
  const gc=document.createElement('canvas');gc.width=gc.height=128;const gx=gc.getContext('2d');const gr=gx.createRadialGradient(64,64,10,64,64,64);gr.addColorStop(0,'rgba(255,220,120,.9)');gr.addColorStop(1,'rgba(255,200,80,0)');gx.fillStyle=gr;gx.fillRect(0,0,128,128);
  const glow=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(gc),transparent:true,depthWrite:false}));glow.scale.set(14,14,1);scene.add(glow);
  const objs=[];const tags=[];
  PLANETS.forEach(([n,s,c],i)=>{const d=6+i*3.6,size=.35+s*.32;const ring=new T.Mesh(new T.RingGeometry(d-.03,d+.03,96),new T.MeshBasicMaterial({color:0x6a7f99,side:T.DoubleSide,transparent:true,opacity:.5}));ring.rotation.x=-Math.PI/2;scene.add(ring);
    const m=new T.Mesh(new T.SphereGeometry(size,32,24),new T.MeshStandardMaterial({map:planetTex(c,i>=4),roughness:.9}));m.userData.i=i;const g=new T.Group();g.add(m);scene.add(g);
    if(i===5){const rg=new T.Mesh(new T.RingGeometry(size*1.4,size*2.2,64),new T.MeshBasicMaterial({color:0xe6cf94,side:T.DoubleSide,transparent:true,opacity:.75}));rg.rotation.x=-Math.PI/2.4;rg.userData.i=i;m.add(rg)}
    objs.push({m,g,d,a:i*.8,sp:.9/Math.pow(i+1,.9)});const t=document.createElement('div');t.className='tag3d off';t.textContent=n;host.appendChild(t);tags.push(t)});
  let ry=.6,rx=.5,dist=44,speed=1,showL=false,sel=-1,raf,down=null,moved=0;
  const size=()=>{const w=host.clientWidth,h=host.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();dist=w/h<.9?62:46};const ro=new ResizeObserver(size);ro.observe(host);size();
  const cv=r.domElement;cv.style.cursor='grab';
  cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};moved=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;moved+=Math.abs(dx)+Math.abs(dy);ry-=dx*.008;rx=clamp(rx+dy*.006,.08,1.4);down={x:e.clientX,y:e.clientY}});
  const ray=new T.Raycaster(),v2=new T.Vector2();cv.addEventListener('pointerup',e=>{if(down&&moved<8){const b=cv.getBoundingClientRect();v2.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);ray.setFromCamera(v2,cam);
    const hit=ray.intersectObjects([sun,...objs.map(o=>o.m)],true)[0];if(hit){let o=hit.object;while(o&&o.userData.i===undefined)o=o.parent;if(o){sel=o.userData.i;onPick(sel)}}}down=null});
  const tmp=new T.Vector3();let last=performance.now();
  const loop=t=>{raf=requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
    cam.position.set(Math.sin(ry)*Math.cos(rx)*dist,Math.sin(rx)*dist,Math.cos(ry)*Math.cos(rx)*dist);cam.lookAt(0,0,0);
    objs.forEach((o,i)=>{o.a+=dt*o.sp*speed*.5;o.m.position.set(Math.cos(o.a)*o.d,0,Math.sin(o.a)*o.d);o.m.rotation.y+=dt;const k=i===sel?1.35:1;o.m.scale.setScalar(k);
      tmp.copy(o.m.position);tmp.project(cam);const tg=tags[i];tg.style.left=((tmp.x+1)/2*host.clientWidth)+'px';tg.style.top=((1-tmp.y)/2*host.clientHeight-18)+'px';tg.classList.toggle('off',!(showL||i===sel))});
    r.render(scene,cam)};raf=requestAnimationFrame(loop);
  return{ok:true,labels:v=>showL=v,speed:v=>speed=v,dispose:()=>{cancelAnimationFrame(raf);ro.disconnect();r.dispose()}};
}

     api.say('انتقال الصوت','اختر المادة بين الجرس والأذن، ثم اقرع الجرس.',[4],false);return ()=>cancelAnimationFrame(raf)}]])

   {obj:2,level:3,type:'mcq',text:'لماذا تبدو النجوم صغيرة جداً؟',options:['لأنها بعيدة جداً','لأنها صغيرة فعلاً','لأنها قريبة','لأنها تنطفئ'],explain:'تبدو النجوم صغيرة لأنها بعيدة.'},
   {obj:1,level:2,type:'mcq',text:'ماذا تعطينا الشمس؟',options:['الضوء والحرارة','المطر فقط','الظلام','الثلج'],explain:'الشمس تعطينا الضوء والحرارة.'},
   {obj:2,level:1,type:'tf',text:'يبقى شكل القمر كما هو كل ليلة.',answer:false,explain:'يتغير شكل القمر الذي نراه من ليلة إلى أخرى.'}],
  exploreHint:'حرّك الساعة لترى سماء النهار والليل، وغيّر شكل القمر.',
  explore:(host,api)=>{let hr=12,ph=2,last='';const stars=Array.from({length:90},(_,i)=>[(i*97%1000)/1000,(i*53%1000)/1000*.7]);

      stars.forEach(([x,y],i)=>{ctx.fillStyle=`rgba(255,255,255,${clamp(1-k*2.5,0,1)*(.5+.4*Math.sin(t*2+i))})`;ctx.beginPath();ctx.arc(x*w,y*h,1.4,0,7);ctx.fill()});
      if(k>0){const sx=w*(.1+(hr-6)/12*.8),sy=h*.8-k*h*.6;const g=ctx.createRadialGradient(sx,sy,2,sx,sy,60);g.addColorStop(0,'#FFF6C8');g.addColorStop(.4,'#FFC93C');g.addColorStop(1,'rgba(255,201,60,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,60,0,7);ctx.fill();
        ctx.fillStyle=`rgba(255,255,255,${k*.9})`;[[.3,.25],[.62,.18]].forEach(([x,y])=>{const cx=x*w+Math.sin(t*.2)*20;ctx.beginPath();ctx.ellipse(cx,y*h,50,16,0,0,7);ctx.ellipse(cx+18,y*h-10,26,16,0,0,7);ctx.fill()})}
      else{const mx=w*.7,my=h*.3,r=Math.min(w,h)*.08;moonPhase(ctx,mx,my,r,[0,.8,1.57,3.14,4.71][ph]);if(ph===0){ctx.strokeStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(mx,my,r,0,7);ctx.stroke()}}
      ctx.fillStyle='#2E5E2A';ctx.fillRect(0,h*.86,w,h*.14);const st=k>0?'day':'night';if(st!==last){last=st;api.say(st==='day'?'سماء النهار':'سماء الليل',st==='day'?'نرى الشمس والغيوم. الشمس تعطينا الضوء والحرارة، ولا ننظر إليها مباشرة.':'نرى القمر والنجوم. النجوم كثيرة وتبدو صغيرة لأنها بعيدة.',st==='day'?[0,1,2]:[3,5],false)}}});

function dragChips(root,chipSel,dropSel,onDrop,onTap){
  $$(chipSel,root).forEach(ch=>{let st=null,gh=null;
    ch.addEventListener('pointerdown',e=>{if(ch.disabled)return;st={x:e.clientX,y:e.clientY};try{ch.setPointerCapture(e.pointerId)}catch(_){}});
    ch.addEventListener('pointermove',e=>{if(!st)return;if(!gh&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){gh=ch.cloneNode(true);gh.classList.add('dragghost','sel');document.body.appendChild(gh)}
      if(gh){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';$$(dropSel,root).forEach(b=>b.classList.remove('over'));const el=document.elementFromPoint(e.clientX,e.clientY);const t=el&&el.closest(dropSel);t&&t.classList.add('over')}});
    ch.addEventListener('pointerup',e=>{if(!st)return;$$(dropSel,root).forEach(b=>b.classList.remove('over'));
      if(gh){gh.remove();gh=null;const el=document.elementFromPoint(e.clientX,e.clientY);const t=el&&el.closest(dropSel);if(t)onDrop(ch,t)}else onTap(ch);st=null});
    ch.addEventListener('pointercancel',()=>{gh&&gh.remove();gh=null;st=null});
  });
}
function actGroups(box,g){

  dragChips(box,'.dchip','.bin',place,ch=>{sel=sel===ch?null:ch;$$('.dchip',box).forEach(c=>c.classList.toggle('sel',c===sel));Sound.tap()});
  $$('.bin',box).forEach(b=>{const f=()=>{if(sel)place(sel,b)};b.addEventListener('click',f);b.addEventListener('keydown',e=>{if(e.key==='Enter')f()})});
}
function actSeq(box,s){
